<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Tug of War</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    // Tap (or spin the Crown) as fast as you can to drag the rope past your line.
    let rope, level = 1, state = 'ready', t = 0, cpuRate, countdown;

    function reset() { rope = 0; cpuRate = 5 + level * 0.9; countdown = 2; hud.innerHTML = `Lv ${level}<small>CPU ${cpuRate.toFixed(1)} taps/s</small>`; }
    function pull(n = 1) { if (state === 'play' && countdown <= 0) rope -= 0.018 * n; }

    function update(dt) {
      t += dt;
      if (countdown > 0) { countdown -= dt; return; }
      rope += 0.018 * cpuRate * dt * W.rand(0.7, 1.3);
      if (rope <= -1 || rope >= 1) {
        state = 'over';
        const won = rope <= -1;
        if (won) { W.best('tugofwar', level); level++; }
        W.overlay({ title: won ? 'You win! 💪' : 'Pulled over! 😵', text: won ? `Next: level ${level}` : `Reached level ${level}`, button: won ? 'Next level' : 'Retry', onStart: start });
      }
    }

    function render() {
      const { w, h } = view;
      ctx.fillStyle = '#87ceeb'; ctx.fillRect(0, 0, w, h * 0.55);
      ctx.fillStyle = '#4caf50'; ctx.fillRect(0, h * 0.55, w, h);
      // Mud pit in the middle.
      ctx.fillStyle = '#6b4220'; ctx.beginPath(); ctx.ellipse(w / 2, h * 0.68, w * 0.12, 8, 0, 0, Math.PI * 2); ctx.fill();
      const off = rope * w * 0.35, y = h * 0.6;
      ctx.strokeStyle = '#c48a50'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.fillStyle = '#ff453a'; ctx.fillRect(w / 2 + off - 2, y - 8, 4, 16);   // rope marker
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.font = '26px sans-serif';
      const lean = Math.sin(t * 20) * 2;
      ctx.fillText('🧍', w * 0.18 + off + lean, y - 6); ctx.fillText('🧍', w * 0.06 + off + lean, y - 6);
      ctx.fillText('🤖', w * 0.82 + off - lean, y - 6); ctx.fillText('🤖', w * 0.94 + off - lean, y - 6);
      ctx.strokeStyle = '#fff'; ctx.setLineDash([4, 4]); ctx.lineWidth = 2;
      for (const x of [w / 2 - w * 0.35, w / 2 + w * 0.35]) { ctx.beginPath(); ctx.moveTo(x, h * 0.55); ctx.lineTo(x, h); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; ctx.font = '800 14px -apple-system, system-ui';
      if (state === 'play' && countdown > 0) ctx.fillText(countdown > 1 ? 'Ready…' : 'PULL!', w / 2, h * 0.3);
      else if (state === 'play') ctx.fillText('TAP TAP TAP!', w / 2, h * 0.85);
    }

    W.pointer(canvas, { down: () => pull() });
    let acc = 0;
    W.crown(d => { acc += Math.abs(d); while (acc > 25) { acc -= 25; pull(); } });
    window.addEventListener('keydown', e => { if (e.key === ' ' && !e.repeat) pull(); });
    function start() { reset(); state = 'play'; }
    reset();
    W.overlay({ title: '💪 Tug of War', text: 'Tap as fast as you can<br>(or spin the Crown) to pull<br>the rope to your side!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(); });
  </script>
</body>
</html>
