<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Hill Racer</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>.hud { text-shadow: 0 1px 2px #0008; }</style>
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    // World in metres, y pointing UP. The car is a rigid body with two sprung wheels.
    const WHEEL_R = 0.42, WHEELS = [[-1.05, -0.45], [1.05, -0.45]], HEAD = [-0.05, 1.0];
    const MASS = 1, INERTIA = 0.9, GRAV = 9.8;
    let car, fuel, coins, pickups, nextPick, throttle, crownGas, crownT, state = 'ready', t = 0, flipT = 0, seed = 1, parts = [], best = W.best('hillracer') || 0;

    // Terrain: layered sines that get steeper the further you go.
    function ground(x) {
      const k = Math.min(1.6, 0.5 + x / 500);
      return Math.sin(x * 0.11 + seed) * 2.2 * k + Math.sin(x * 0.037 + seed * 2) * 5 * k + Math.sin(x * 0.27 + seed * 3) * 0.5 * k + Math.sin(x * 0.009) * 9;
    }
    const slope = x => (ground(x + 0.05) - ground(x - 0.05)) / 0.1;

    function reset() {
      seed = W.rand(0, 100);
      car = { x: 4, y: ground(4) + 1.4, a: 0, vx: 0, vy: 0, va: 0, wheelSpin: [0, 0], contact: [false, false] };
      fuel = 100; coins = 0; pickups = []; nextPick = 20; throttle = 0; crownGas = 0; flipT = 0; t = 0; parts = [];
      updateHud();
    }
    function updateHud() { hud.innerHTML = `${Math.floor(car.x)}m<small>🪙 ${coins}</small>`; }

    const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];

    function physics(dt) {
      const gas = state === 'play' && fuel > 0 ? throttle : 0;
      car.vy -= GRAV * dt;
      let grounded = 0;
      WHEELS.forEach((off, i) => {
        const r = rot(off, car.a), wx = car.x + r[0], wy = car.y + r[1];
        const gy = ground(wx), pen = gy + WHEEL_R - wy;
        car.contact[i] = pen > 0;
        if (pen <= 0) return;
        grounded++;
        const s = slope(wx), nl = Math.hypot(1, s), nx = -s / nl, ny = 1 / nl, tx = 1 / nl, ty = s / nl;
        // Velocity of the wheel hub (linear + rotational).
        const pvx = car.vx - car.va * r[1], pvy = car.vy + car.va * r[0];
        const vn = pvx * nx + pvy * ny, vt = pvx * tx + pvy * ty;
        // Suspension spring + damper along the ground normal.
        const fn = Math.max(0, pen * 260 - vn * 18);
        // Drive / brake along the ground; rolling friction otherwise.
        // Engine fades out toward top speed (~16 m/s) so the car stays readable on a small screen.
        let ft = gas * 9.5 * (i === 0 ? 1 : 0.6) * (gas > 0 ? Math.max(0, 1 - vt / 16) : 1);
        if (gas === 0) ft = -vt * 0.6;
        ft = W.clamp(ft - vt * 0.05, -fn * 1.1, fn * 1.1);
        const fx = nx * fn + tx * ft, fy = ny * fn + ty * ft;
        car.vx += fx / MASS * dt; car.vy += fy / MASS * dt;
        car.va += (r[0] * fy - r[1] * fx) / INERTIA * dt;
        car.wheelSpin[i] += vt / WHEEL_R * dt;
      });
      // In the air the throttle tilts the car (gas = lean back, brake = lean forward).
      if (!grounded) car.va += gas * 2.6 * dt;
      car.va *= Math.pow(grounded ? 0.3 : 0.8, dt);
      car.x += car.vx * dt; car.y += car.vy * dt; car.a += car.va * dt;
      if (car.x < 1) { car.x = 1; car.vx = Math.max(0, car.vx); }
    }

    function update(dt) {
      t += dt;
      crownT = Math.max(0, (crownT || 0) - dt);
      if (crownT <= 0) crownGas *= Math.pow(0.05, dt);
      throttle = W.clamp(hold + crownGas, -1, 1);
      for (let k = 0; k < 8; k++) physics(dt / 8);
      fuel -= dt * (2.2 + Math.abs(throttle) * 3.5);
      // Pickups: fuel cans and coin runs along the road.
      while (nextPick < car.x + 60) {
        if (Math.floor(nextPick / 20) % 6 === 5) pickups.push({ x: nextPick, kind: 'fuel' });
        else for (let k = 0; k < 4; k++) pickups.push({ x: nextPick + k * 1.6, kind: 'coin' });
        nextPick += 20 + Math.min(25, car.x / 40);
      }
      for (const p of pickups) {
        if (p.got) continue;
        const py = ground(p.x) + 1;
        if (Math.abs(p.x - car.x) < 1.3 && Math.abs(py - car.y) < 1.6) {
          p.got = true;
          if (p.kind === 'fuel') { fuel = 100; W.sfx(500, { type: 'sine', dur: 0.25, vol: 0.1, slide: 1000 }); }
          else { coins++; W.sfx(1500, { type: 'square', dur: 0.04, vol: 0.03 }); }
        }
      }
      pickups = pickups.filter(p => p.x > car.x - 20 && !p.got);
      // Crash if the driver's head hits the ground, or you stay upside down.
      const hp = rot(HEAD, car.a), hx = car.x + hp[0], hy = car.y + hp[1];
      const upside = Math.cos(car.a) < -0.2;
      flipT = upside && (car.contact[0] || car.contact[1] || hy < ground(hx) + 0.6) ? flipT + dt : 0;
      if (hy < ground(hx) + 0.25 || flipT > 1) return end('Ouch! Head first 🤕');
      if (fuel <= 0 && Math.hypot(car.vx, car.vy) < 0.3) return end('Out of fuel ⛽️');
      if (W.rng() < dt * 30 && (car.contact[0] || car.contact[1]) && Math.abs(throttle) > 0.2) { const r = rot(WHEELS[0], car.a); parts.push({ x: car.x + r[0] - 0.4, y: car.y + r[1] - 0.3, vx: -car.vx * 0.2 - 1, vy: W.rand(0.5, 2), t: 0.5 }); }
      updateHud();
    }
    function end(why) {
      state = 'over';
      W.sfx(140, { type: 'sawtooth', dur: 0.4, vol: 0.1, slide: 50 });
      const score = Math.floor(car.x) + coins * 5;
      best = W.best('hillracer', score);
      setTimeout(() => W.overlay({ title: why, big: Math.floor(car.x) + 'm', text: `🪙 ${coins} · score ${score} · best ${best}`, button: 'Drive again', onStart: start }), 600);
    }

    function render(dt) {
      const { w, h } = view;
      const PPM = w / 15;   // pixels per metre
      const camX = car.x + 2, camY = car.y;
      const sx = x => w * 0.42 + (x - camX) * PPM, sy = y => h * 0.55 - (y - camY) * PPM;
      const sky = ctx.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#62b6ff'); sky.addColorStop(1, '#d6efff');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
      // Parallax hills.
      ctx.fillStyle = '#a8d58a';
      ctx.beginPath(); ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 6) ctx.lineTo(x, h * 0.5 + Math.sin((x + camX * PPM * 0.3) * 0.02) * 14 - 10);
      ctx.lineTo(w, h); ctx.fill();
      // Ground: dirt with a grass edge.
      ctx.beginPath(); ctx.moveTo(0, h);
      for (let px = -2; px <= w + 2; px += 3) ctx.lineTo(px, sy(ground(camX + (px - w * 0.42) / PPM)));
      ctx.lineTo(w, h); ctx.closePath();
      ctx.fillStyle = '#8b5a2b'; ctx.fill();
      ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 5; ctx.beginPath();
      for (let px = -2; px <= w + 2; px += 3) ctx[px < 0 ? 'moveTo' : 'lineTo'](px, sy(ground(camX + (px - w * 0.42) / PPM)) + 2);
      ctx.stroke();
      // Distance flags every 50 m.
      for (let m = Math.ceil((camX - 10) / 50) * 50; m < camX + 15; m += 50) { const x = sx(m), y = sy(ground(m)); ctx.fillStyle = '#fff'; ctx.fillRect(x, y - 26, 2, 26); ctx.fillStyle = '#ff453a'; ctx.fillRect(x + 2, y - 26, 12, 8); ctx.fillStyle = '#000'; ctx.font = '700 7px -apple-system, system-ui'; ctx.textAlign = 'left'; ctx.fillText(m + 'm', x + 3, y - 20); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const p of pickups) { const x = sx(p.x), y = sy(ground(p.x) + 1); ctx.font = `${Math.round(PPM * (p.kind === 'fuel' ? 1 : 0.7))}px sans-serif`; ctx.fillStyle = '#000'; ctx.fillText(p.kind === 'fuel' ? '⛽️' : '🪙', x, y + Math.sin(t * 4 + p.x) * 2); }
      for (const p of parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 6 * dt; ctx.fillStyle = `rgba(139,90,43,${p.t * 2})`; ctx.fillRect(sx(p.x), sy(p.y), 3, 3); }
      parts = parts.filter(p => p.t > 0);
      // Car body.
      ctx.save(); ctx.translate(sx(car.x), sy(car.y)); ctx.rotate(-car.a); ctx.scale(PPM, PPM);
      ctx.fillStyle = '#ff453a';
      ctx.beginPath(); ctx.moveTo(-1.4, 0.1); ctx.lineTo(1.45, 0.1); ctx.lineTo(1.45, -0.35); ctx.lineTo(0.7, -0.4); ctx.lineTo(0.35, -0.85); ctx.lineTo(-0.9, -0.85); ctx.lineTo(-1.4, -0.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.moveTo(0.25, -0.42); ctx.lineTo(0.5, -0.42); ctx.lineTo(0.3, -0.78); ctx.lineTo(0.12, -0.78); ctx.fill();
      ctx.fillStyle = '#f2c28b'; ctx.beginPath(); ctx.arc(-0.05, -0.98, 0.22, 0, 7); ctx.fill();   // driver head (y flipped)
      ctx.fillStyle = '#ffd60a'; ctx.beginPath(); ctx.arc(-0.05, -1.06, 0.22, Math.PI, 0); ctx.fill();   // helmet
      ctx.fillStyle = '#ffd60a'; ctx.fillRect(1.3, -0.25, 0.15, 0.12);   // headlight
      ctx.restore();
      WHEELS.forEach((off, i) => {
        const r = rot(off, car.a), x = sx(car.x + r[0]), y = sy(car.y + r[1]), R = WHEEL_R * PPM;
        ctx.fillStyle = '#1c1c1e'; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
        ctx.fillStyle = '#8e8e93'; ctx.beginPath(); ctx.arc(x, y, R * 0.45, 0, 7); ctx.fill();
        ctx.strokeStyle = '#1c1c1e'; ctx.lineWidth = 1.5; ctx.beginPath(); const sp = -car.wheelSpin[i]; ctx.moveTo(x + Math.cos(sp) * R * 0.45, y + Math.sin(sp) * R * 0.45); ctx.lineTo(x - Math.cos(sp) * R * 0.45, y - Math.sin(sp) * R * 0.45); ctx.stroke();
      });
      // Fuel gauge and pedals.
      ctx.fillStyle = '#0006'; ctx.fillRect(38, 10, 50, 8);
      ctx.fillStyle = fuel < 25 ? '#ff453a' : '#30d158'; ctx.fillRect(39, 11, 48 * Math.max(0, fuel) / 100, 6);
      ctx.font = '9px sans-serif'; ctx.fillText('⛽️', 32, 15);
      if (fuel < 25 && Math.floor(t * 3) % 2) { ctx.fillStyle = '#ff453a'; ctx.font = '800 11px -apple-system, system-ui'; ctx.fillText('LOW FUEL', w / 2, 34); }
      ctx.globalAlpha = 0.85;
      for (const [x, label, on] of [[22, 'BRAKE', throttle < -0.1], [w - 22, 'GAS', throttle > 0.1]]) { ctx.fillStyle = on ? '#fff' : '#ffffff55'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 17, h - 26, 34, 20, 6) : ctx.rect(x - 17, h - 26, 34, 20); ctx.fill(); ctx.fillStyle = '#000'; ctx.font = '800 8px -apple-system, system-ui'; ctx.fillText(label, x, h - 16); }
      ctx.globalAlpha = 1;
    }

    // Hold right = gas, left = brake/reverse (multi-touch aware). The Crown works as a throttle too.
    let hold = 0;
    const touches = new Map();
    const setHold = () => { let g = 0, b = 0; for (const x of touches.values()) { if (x > view.w / 2) g = 1; else b = 1; } hold = g - b; };
    canvas.addEventListener('touchstart', e => { e.preventDefault(); for (const tt of e.changedTouches) touches.set(tt.identifier, tt.clientX); setHold(); }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); for (const tt of e.changedTouches) touches.delete(tt.identifier); setHold(); }, { passive: false });
    canvas.addEventListener('touchcancel', () => { touches.clear(); setHold(); });
    canvas.addEventListener('mousedown', e => { touches.set('m', e.clientX); setHold(); });
    window.addEventListener('mouseup', () => { touches.delete('m'); setHold(); });
    W.crown(d => { crownGas = W.clamp(crownGas + d * 0.02, -1, 1); crownT = 0.35; });
    window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') hold = 1; if (e.key === 'ArrowLeft') hold = -1; });
    window.addEventListener('keyup', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') hold = 0; });

    function start() { reset(); state = 'play'; }
    reset();
    W.overlay({ title: '🏎️ Hill Racer', text: 'Hold right = gas, left = brake<br>(or turn the Crown). Lean in<br>the air. Grab ⛽️ — don\'t flip!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); else if (state === 'ready') { for (let k = 0; k < 8; k++) physics(dt / 8); } render(dt); });
  </script>
</body>
</html>
