<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Penalty Kick</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    const KICKS = 10;

    let ball, keeper, kick, goals, taken, state = 'ready', msg = '', msgT = 0, history = [];
    const GOAL = () => ({ x: view.w * 0.08, y: view.h * 0.2, w: view.w * 0.84, h: view.h * 0.3 });
    const SPOT = () => ({ x: view.w / 2, y: view.h * 0.86 });

    function resetKick() {
      const s = SPOT();
      ball = { x: s.x, y: s.y, r: 9, t: 0 };
      const g = GOAL();
      keeper = { x: g.x + g.w / 2, dive: 0, target: g.x + g.w / 2, y: g.y + g.h };
      kick = null;
    }
    function updateHud() { hud.innerHTML = `${goals}/${taken}<small>${KICKS - taken} left</small>`; }

    // Swipe toward the goal: where you release is where you aim; faster swipes are harder to save.
    function shoot(from, to, ms) {
      if (state !== 'play' || kick) return;
      const g = GOAL();
      const dx = to.x - from.x, dy = to.y - from.y;
      if (dy > -20) return;
      // Extend the swipe line up to the goal plane.
      const t = (g.y + g.h * 0.5 - from.y) / dy;
      const tx = SPOT().x + dx * t * 0.9;
      const ty = W.clamp(g.y + g.h + dy * 0.25 * (200 / Math.max(80, ms)), g.y - 20, g.y + g.h - 6);
      const speed = W.clamp(260 / Math.max(80, ms), 0.6, 2.2);
      kick = { tx, ty, dur: 0.55 / speed, speed };
      // Keeper guesses: leans toward your recent habits, reacts late to hard shots.
      const recent = history.slice(-4), leftBias = recent.filter(h => h < 0).length - recent.filter(h => h > 0).length;
      const guess = Math.random() < 0.45 ? tx : g.x + g.w * (0.5 - leftBias * 0.12 + W.rand(-0.35, 0.35));
      keeper.target = W.clamp(guess, g.x + 10, g.x + g.w - 10);
      history.push(tx - (g.x + g.w / 2));
    }

    function update(dt) {
      if (!kick) return;
      ball.t += dt / kick.dur;
      const t = Math.min(1, ball.t), s = SPOT();
      ball.x = s.x + (kick.tx - s.x) * t;
      ball.y = s.y + (kick.ty - s.y) * t - Math.sin(Math.PI * t) * 12;
      ball.r = 9 - 4 * t;
      // Keeper dives with limited reach and speed.
      const reach = view.w * (1.3 / kick.speed);
      keeper.x += W.clamp(keeper.target - keeper.x, -reach * dt, reach * dt);
      keeper.dive = W.clamp((keeper.x - (GOAL().x + GOAL().w / 2)) / (GOAL().w / 2), -1, 1);
      if (t >= 1) {
        const g = GOAL();
        const inGoal = kick.tx > g.x + 4 && kick.tx < g.x + g.w - 4 && kick.ty > g.y + 2;
        const saved = inGoal && Math.abs(kick.tx - keeper.x) < g.w * 0.17 && kick.ty > g.y + g.h * 0.15;
        taken++;
        if (!inGoal) msg = 'Wide! ❌';
        else if (saved) msg = 'Saved! 🧤';
        else { goals++; msg = 'GOAL! ⚽️🎉'; }
        msgT = 1;
        updateHud();
        kick = null;
        state = 'wait';
        setTimeout(() => {
          if (taken >= KICKS) {
            state = 'over';
            const best = W.best('penalty', goals);
            W.overlay({ title: 'Full time!', big: `${goals}/${KICKS}`, text: `Best ${best}`, button: 'Again', onStart: start });
          } else { resetKick(); state = 'play'; }
        }, 1000);
      }
    }

    function render(dt) {
      const { w, h } = view;
      ctx.fillStyle = '#2e8b3a';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#2e8b3a' : '#33963f'; ctx.fillRect(0, h * 0.5 + i * h * 0.09, w, h * 0.09); }
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, w, GOAL().y - 4);
      const g = GOAL();
      // Net.
      ctx.fillStyle = '#ffffff18';
      ctx.fillRect(g.x, g.y, g.w, g.h);
      ctx.strokeStyle = '#ffffff30'; ctx.lineWidth = 1;
      for (let x = g.x; x < g.x + g.w; x += 8) { ctx.beginPath(); ctx.moveTo(x, g.y); ctx.lineTo(x, g.y + g.h); ctx.stroke(); }
      for (let y = g.y; y < g.y + g.h; y += 8) { ctx.beginPath(); ctx.moveTo(g.x, y); ctx.lineTo(g.x + g.w, y); ctx.stroke(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(g.x, g.y + g.h); ctx.lineTo(g.x, g.y); ctx.lineTo(g.x + g.w, g.y); ctx.lineTo(g.x + g.w, g.y + g.h); ctx.stroke();
      ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, g.y + g.h); ctx.lineTo(w, g.y + g.h); ctx.stroke();

      // Keeper.
      ctx.save();
      ctx.translate(keeper.x, g.y + g.h - 2);
      ctx.rotate(keeper.dive * 0.9);
      ctx.fillStyle = '#ffd60a';
      ctx.fillRect(-4, -g.h * 0.7, 8, g.h * 0.55);
      ctx.fillRect(-g.w * 0.12, -g.h * 0.68, g.w * 0.24, 4);
      ctx.fillStyle = '#f2c28b';
      ctx.beginPath(); ctx.arc(0, -g.h * 0.78, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      ctx.font = `${Math.round(ball.r * 2.2)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000';
      ctx.fillText('⚽️', ball.x, ball.y);
      if (msgT > 0) {
        msgT -= dt;
        ctx.globalAlpha = Math.min(1, msgT * 3);
        ctx.fillStyle = '#fff'; ctx.font = '800 17px -apple-system, system-ui';
        ctx.fillText(msg, w / 2, h * 0.62);
        ctx.globalAlpha = 1;
      } else if (state === 'play' && taken === 0 && !kick) {
        ctx.fillStyle = '#fff'; ctx.font = '600 11px -apple-system, system-ui';
        ctx.fillText('Swipe up to shoot', w / 2, h * 0.65);
      }
    }

    let from = null, t0 = 0;
    W.pointer(canvas, { down(p) { from = p; t0 = performance.now(); }, up(p) { if (from) shoot(from, p, performance.now() - t0); from = null; } });

    function start() { goals = 0; taken = 0; history = []; resetKick(); updateHud(); state = 'play'; }
    goals = 0; taken = 0; resetKick(); updateHud();
    W.overlay({ title: '⚽️ Penalty Kick', text: 'Swipe up toward a corner.<br>Faster swipes are harder<br>to save. 10 kicks!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
