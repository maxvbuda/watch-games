<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Plinko</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const BALLS = 10;
    const BINS = [10, 3, 1, 0.5, 1, 3, 10];
    const ROWS = 8;
    let pegs = [], balls, left, score, state = 'ready', binY, binW, flashes = [];
    const PR = 2.5, BR = 4;
    const view = W.setupCanvas(canvas, (w, h) => layout(w, h));
    const ctx = view.ctx;


    function layout(w, h) {
      pegs = [];
      const top = 44, bottom = h - 30;
      const gapY = (bottom - top) / ROWS;
      const gapX = w / 7.5;
      for (let r = 0; r < ROWS; r++) {
        const n = r % 2 ? 7 : 8;
        const off = (w - (n - 1) * gapX) / 2;
        for (let i = 0; i < n; i++) pegs.push({ x: off + i * gapX, y: top + r * gapY });
      }
      binY = h - 24;
      binW = w / BINS.length;
    }

    function drop(x) {
      if (state !== 'play' || left <= 0) return;
      left--;
      balls.push({ x: W.clamp(x, BR, view.w - BR), y: 32, vx: W.rand(-8, 8), vy: 0 });
      updateHud();
    }

    function updateHud() { hud.innerHTML = `${score}<small>${left} balls</small>`; }

    function update(dt) {
      const g = view.h * 1.8;
      for (const b of balls) {
        const steps = 3;
        for (let s = 0; s < steps; s++) {
          const h = dt / steps;
          b.vy += g * h;
          b.x += b.vx * h; b.y += b.vy * h;
          if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx) * 0.6; }
          if (b.x > view.w - BR) { b.x = view.w - BR; b.vx = -Math.abs(b.vx) * 0.6; }
          for (const p of pegs) {
            const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
            if (d < PR + BR && d > 0) {
              const nx = dx / d, ny = dy / d;
              b.x = p.x + nx * (PR + BR); b.y = p.y + ny * (PR + BR);
              const dot = b.vx * nx + b.vy * ny;
              if (dot < 0) {
                b.vx = (b.vx - 2 * dot * nx) * 0.5 + W.rand(-6, 6);
                b.vy = (b.vy - 2 * dot * ny) * 0.5;
                // Never let a ball balance on top of a peg.
                if (Math.abs(b.vx) < 15) b.vx = (Math.random() < 0.5 ? -1 : 1) * W.rand(15, 30);
              }
              p.hit = 0.15;
            }
          }
        }
        if (b.y > binY && !b.done) {
          b.done = true;
          const i = W.clamp(Math.floor(b.x / binW), 0, BINS.length - 1);
          const pts = Math.round(BINS[i] * 10);
          score += pts;
          flashes.push({ i, t: 0.5, pts });
          updateHud();
        }
      }
      balls = balls.filter(b => b.y < view.h + 10);
      if (left === 0 && balls.length === 0) {
        state = 'over';
        const best = W.best('plinko', score);
        setTimeout(() => W.overlay({ title: 'All dropped!', big: score, text: `Best ${best}`, button: 'Again', onStart: start }), 300);
      }
    }

    function render(dt) {
      const { w, h } = view;
      ctx.fillStyle = '#0b0b1a';
      ctx.fillRect(0, 0, w, h);
      for (const p of pegs) {
        p.hit = Math.max(0, (p.hit || 0) - dt);
        ctx.fillStyle = p.hit ? '#ffd60a' : '#8e8e93';
        ctx.beginPath(); ctx.arc(p.x, p.y, PR + (p.hit ? 1 : 0), 0, Math.PI * 2); ctx.fill();
      }
      BINS.forEach((m, i) => {
        const f = flashes.find(f => f.i === i);
        const hue = m >= 10 ? '#ff453a' : m >= 3 ? '#ff9f0a' : m >= 1 ? '#30d158' : '#0a84ff';
        ctx.fillStyle = f ? '#fff' : hue;
        ctx.fillRect(i * binW + 1, binY, binW - 2, h - binY);
        ctx.fillStyle = '#000';
        ctx.font = '700 9px -apple-system, system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(m + '×', (i + 0.5) * binW, binY + (h - binY) / 2 - 2);
      });
      for (const f of flashes) f.t -= dt;
      flashes = flashes.filter(f => f.t > 0);
      ctx.fillStyle = '#ff375f';
      for (const b of balls) { ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, Math.PI * 2); ctx.fill(); }
      if (state === 'play' && left === BALLS) {
        ctx.fillStyle = '#8e8e93';
        ctx.font = '600 11px -apple-system, system-ui';
        ctx.fillText('Tap to drop a ball', w / 2, 30);
      }
    }

    W.pointer(canvas, { down: p => drop(p.x) });
    function start() { balls = []; left = BALLS; score = 0; state = 'play'; updateHud(); }
    balls = []; left = BALLS; score = 0; updateHud();
    W.overlay({ title: '🔻 Plinko', text: `Tap to drop ${BALLS} balls.<br>Aim for the 10× edges!`, onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
