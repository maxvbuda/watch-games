<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Darts</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    const TAU = Math.PI * 2;
    const NUMS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const DARTS = 9;

    let t = 0, darts, score, left, state = 'ready', lastMsg = '', msgT = 0;
    // Board rings as fractions of radius: bull, outer bull, triple, double.
    const RINGS = { bull: 0.06, obull: 0.13, tIn: 0.52, tOut: 0.6, dIn: 0.9, dOut: 1 };
    const board = () => ({ cx: view.w / 2, cy: view.h / 2 + 10, r: Math.min(view.w, view.h - 30) * 0.44 });

    function scoreAt(x, y) {
      const { cx, cy, r } = board();
      const d = Math.hypot(x - cx, y - cy) / r;
      if (d > RINGS.dOut) return [0, 'Miss'];
      if (d < RINGS.bull) return [50, 'BULLSEYE!'];
      if (d < RINGS.obull) return [25, 'Bull 25'];
      const a = (Math.atan2(y - cy, x - cx) + Math.PI / 2 + TAU / 40 + TAU) % TAU;
      const n = NUMS[Math.floor(a / (TAU / 20)) % 20];
      if (d > RINGS.dIn) return [n * 2, `Double ${n}`];
      if (d > RINGS.tIn && d < RINGS.tOut) return [n * 3, `Triple ${n}`];
      return [n, String(n)];
    }

    // The aim drifts in a looping pattern that gets wilder with each dart.
    function aim() {
      const { cx, cy, r } = board();
      const k = 0.22 + (DARTS - left) * 0.025;
      return { x: cx + Math.sin(t * 1.7) * r * k + Math.sin(t * 3.1) * r * k * 0.5, y: cy + Math.cos(t * 1.3) * r * k + Math.sin(t * 2.3) * r * k * 0.5 };
    }

    function throwDart() {
      if (state !== 'play' || left <= 0) return;
      const p = aim();
      const [pts, msg] = scoreAt(p.x, p.y);
      darts.push(p);
      score += pts;
      left--;
      lastMsg = msg; msgT = 0.9;
      hud.innerHTML = `${score}<small>${left} darts</small>`;
      if (!left) {
        state = 'over';
        const best = W.best('darts', score);
        setTimeout(() => W.overlay({ title: 'Round over 🎯', big: score, text: `Best ${best}`, button: 'Again', onStart: start }), 900);
      }
    }

    function render(dt) {
      t += dt;
      const { w, h } = view;
      ctx.fillStyle = '#1a1410';
      ctx.fillRect(0, 0, w, h);
      const { cx, cy, r } = board();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(cx, cy, r * 1.12, 0, TAU); ctx.fill();
      for (let i = 0; i < 20; i++) {
        const a0 = -Math.PI / 2 - TAU / 40 + i * TAU / 20, a1 = a0 + TAU / 20;
        const dark = i % 2 === 0;
        const seg = (r0, r1, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r * r1, a0, a1); ctx.arc(cx, cy, r * r0, a1, a0, true); ctx.fill(); };
        seg(RINGS.obull, RINGS.tIn, dark ? '#1c1c1e' : '#f2e6c9');
        seg(RINGS.tIn, RINGS.tOut, dark ? '#e0302a' : '#1f9d4a');
        seg(RINGS.tOut, RINGS.dIn, dark ? '#1c1c1e' : '#f2e6c9');
        seg(RINGS.dIn, RINGS.dOut, dark ? '#e0302a' : '#1f9d4a');
        const am = (a0 + a1) / 2;
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${Math.round(r * 0.09)}px -apple-system, system-ui`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(NUMS[i], cx + Math.cos(am) * r * 1.06, cy + Math.sin(am) * r * 1.06);
      }
      ctx.fillStyle = '#1f9d4a'; ctx.beginPath(); ctx.arc(cx, cy, r * RINGS.obull, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e0302a'; ctx.beginPath(); ctx.arc(cx, cy, r * RINGS.bull, 0, TAU); ctx.fill();

      for (const d of darts) {
        ctx.fillStyle = '#ffd60a';
        ctx.beginPath(); ctx.arc(d.x, d.y, 2.5, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
      }
      if (state === 'play') {
        const p = aim();
        ctx.strokeStyle = '#64d2ff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.x - 10, p.y); ctx.lineTo(p.x + 10, p.y); ctx.moveTo(p.x, p.y - 10); ctx.lineTo(p.x, p.y + 10); ctx.stroke();
      }
      if (msgT > 0) {
        msgT -= dt;
        ctx.globalAlpha = Math.min(1, msgT * 3);
        ctx.fillStyle = '#fff';
        ctx.font = '800 15px -apple-system, system-ui';
        ctx.fillText(lastMsg, w / 2, h - 12);
        ctx.globalAlpha = 1;
      }
    }

    W.pointer(canvas, { down: throwDart });
    window.addEventListener('keydown', e => { if (e.key === ' ') throwDart(); });
    function start() { darts = []; score = 0; left = DARTS; state = 'play'; hud.innerHTML = `0<small>${left} darts</small>`; }
    darts = []; score = 0; left = DARTS;
    W.overlay({ title: '🎯 Darts', text: `The aim wobbles —<br>tap to throw. ${DARTS} darts.<br>Triples & bull score big!`, onStart: start });
    W.loop(render);
  </script>
</body>
</html>
