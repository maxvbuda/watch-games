<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Artillery</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;

    let terrain, me, cpu, wind, shell, turn, power, pdir, angle, cpuErr, score = { me: 0, cpu: 0 }, state = 'ready', msg = '', msgT = 0, blast = null;
    const G = () => view.h * 0.55;
    const COLS = 100;

    function makeTerrain() {
      terrain = [];
      const a = W.rand(0, 6), b = W.rand(0, 6);
      for (let i = 0; i <= COLS; i++) {
        const t = i / COLS;
        terrain.push(view.h * (0.72 + 0.1 * Math.sin(t * 5 + a) + 0.05 * Math.sin(t * 13 + b)));
      }
    }
    const groundAt = x => { const i = W.clamp(x / view.w * COLS, 0, COLS); const i0 = Math.floor(i), i1 = Math.min(COLS, i0 + 1); return terrain[i0] + (terrain[i1] - terrain[i0]) * (i - i0); };

    function newRound() {
      makeTerrain();
      me = { x: view.w * W.rand(0.08, 0.2) };
      cpu = { x: view.w * W.rand(0.8, 0.92) };
      wind = W.rand(-1, 1) * view.w * 0.12;
      angle = -Math.PI / 4; power = 0.5; pdir = 1;
      cpuErr = W.rand(0.15, 0.25);
      turn = 'me'; shell = null; blast = null;
      updateHud();
    }
    function updateHud() { hud.innerHTML = `${score.me}–${score.cpu}<small>wind ${wind > 0 ? '→' : '←'}${Math.abs(Math.round(wind / view.w * 100))}</small>`; }

    function fire(who, a, p) {
      const t = who === 'me' ? me : cpu;
      const sp = view.h * (0.45 + p * 0.95);
      shell = { x: t.x, y: groundAt(t.x) - 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, who };
      turn = 'flying';
    }

    // CPU: simulate a few candidate shots and pick the closest, then add error that shrinks each turn.
    function cpuShoot() {
      let best = null, bd = Infinity;
      for (let a = -Math.PI * 0.9; a <= -Math.PI * 0.55; a += 0.04) {
        for (let p = 0.2; p <= 1; p += 0.05) {
          const land = simulate(cpu.x, groundAt(cpu.x) - 8, a, p);
          const d = Math.abs(land - me.x);
          if (d < bd) { bd = d; best = [a, p]; }
        }
      }
      const [a, p] = best;
      fire('cpu', a + W.rand(-1, 1) * cpuErr * 0.3, W.clamp(p + W.rand(-1, 1) * cpuErr, 0.1, 1));
      cpuErr *= 0.6;
    }
    function simulate(x, y, a, p) {
      const sp = view.h * (0.45 + p * 0.95);
      let vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
      for (let i = 0; i < 600; i++) {
        const dt = 0.01;
        vx += wind * dt; vy += G() * dt; x += vx * dt; y += vy * dt;
        if (x < -50 || x > view.w + 50) return x;
        if (y >= groundAt(x)) return x;
      }
      return x;
    }

    function explode(x, y) {
      blast = { x, y, t: 0 };
      const R = view.w * 0.07;
      for (let i = 0; i <= COLS; i++) {
        const tx = i / COLS * view.w, dx = tx - x;
        if (Math.abs(dx) < R) terrain[i] = Math.max(terrain[i], y + Math.sqrt(R * R - dx * dx) * 0.8);
      }
      const hitR = view.w * 0.07;
      const hitMe = Math.hypot(me.x - x, groundAt(me.x) - y) < hitR, hitCpu = Math.hypot(cpu.x - x, groundAt(cpu.x) - y) < hitR;
      if (hitMe || hitCpu) {
        const winner = hitCpu ? 'me' : 'cpu';
        score[winner]++;
        W.best('artillery', score.me);
        msg = winner === 'me' ? 'Direct hit! 🎯' : 'You got hit! 💥';
        msgT = 1.5;
        updateHud();
        state = 'between';
        setTimeout(() => {
          if (score.me >= 3 || score.cpu >= 3) {
            state = 'over';
            W.overlay({ title: score.me >= 3 ? 'Victory! 🏆' : 'Defeated', big: `${score.me}–${score.cpu}`, text: 'First to 3 hits', button: 'Again', onStart: start });
          } else { newRound(); state = 'play'; }
        }, 1500);
        return;
      }
      msg = 'Miss'; msgT = 0.8;
      if (shell.who === 'me') { turn = 'cpu'; setTimeout(cpuShoot, 700); }
      else turn = 'me';
    }

    function update(dt) {
      if (turn === 'me') {
        power += pdir * dt * 0.7;
        if (power > 1) { power = 1; pdir = -1; }
        if (power < 0.1) { power = 0.1; pdir = 1; }
      }
      if (shell) {
        shell.vx += wind * dt; shell.vy += G() * dt;
        shell.x += shell.vx * dt; shell.y += shell.vy * dt;
        if (shell.x < -30 || shell.x > view.w + 30 || shell.y > view.h) { const s = shell; shell = null; msg = 'Out!'; msgT = 0.8; if (s.who === 'me') { turn = 'cpu'; setTimeout(cpuShoot, 700); } else turn = 'me'; }
        else if (shell.y >= groundAt(shell.x)) { const s = shell; explode(s.x, s.y); shell = null; }
      }
    }

    function tank(x, color, a, flip) {
      const y = groundAt(x);
      ctx.fillStyle = color;
      ctx.fillRect(x - 7, y - 6, 14, 6);
      ctx.beginPath(); ctx.arc(x, y - 6, 4, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + Math.cos(a) * 11, y - 7 + Math.sin(a) * 11); ctx.stroke();
    }

    function render(dt) {
      const { w, h } = view;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#0b1d3a'); g.addColorStop(1, '#2a3f6a');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      if (!terrain) return;
      ctx.fillStyle = '#5b7f3a';
      ctx.beginPath(); ctx.moveTo(0, h);
      terrain.forEach((y, i) => ctx.lineTo(i / COLS * w, y));
      ctx.lineTo(w, h); ctx.fill();
      tank(me.x, '#30d158', angle);
      tank(cpu.x, '#ff453a', -Math.PI * 0.75);
      if (shell) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(shell.x, shell.y, 2.5, 0, Math.PI * 2); ctx.fill(); }
      if (blast) {
        blast.t += dt;
        ctx.fillStyle = `rgba(255,159,10,${Math.max(0, 1 - blast.t * 2)})`;
        ctx.beginPath(); ctx.arc(blast.x, blast.y, view.w * 0.07 * Math.min(1, blast.t * 5), 0, Math.PI * 2); ctx.fill();
      }
      if (turn === 'me' && state === 'play') {
        // Aim line and power meter.
        const y = groundAt(me.x) - 7;
        ctx.strokeStyle = '#ffffff55'; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(me.x, y); ctx.lineTo(me.x + Math.cos(angle) * 35, y + Math.sin(angle) * 35); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#0006'; ctx.fillRect(w * 0.25, 36, w * 0.5, 8);
        ctx.fillStyle = power > 0.8 ? '#ff453a' : power > 0.5 ? '#ffd60a' : '#30d158';
        ctx.fillRect(w * 0.25 + 1, 37, (w * 0.5 - 2) * power, 6);
        ctx.fillStyle = '#fff'; ctx.font = '600 9px -apple-system, system-ui'; ctx.textAlign = 'center';
        ctx.fillText(`${Math.round(-angle * 57.3)}° · tap to fire`, w / 2, 54);
      }
      if (msgT > 0) {
        msgT -= dt;
        ctx.globalAlpha = Math.min(1, msgT * 3);
        ctx.fillStyle = '#fff'; ctx.font = '800 15px -apple-system, system-ui'; ctx.textAlign = 'center';
        ctx.fillText(msg, w / 2, h * 0.35);
        ctx.globalAlpha = 1;
      }
    }

    const setAngle = a => (angle = W.clamp(a, -Math.PI * 0.47, -0.05));
    W.crown(d => { if (turn === 'me') setAngle(angle - d * 0.006); });
    // Tap to fire at the current power. Swiping up/down also adjusts the angle.
    let sy = 0, moved = false;
    W.pointer(canvas, {
      down(p) { sy = p.y; moved = false; },
      move(p) { if (turn === 'me' && Math.abs(p.y - sy) > 4) { setAngle(angle + (p.y - sy) * 0.01); sy = p.y; moved = true; } },
      up() { if (!moved && turn === 'me' && state === 'play') fire('me', angle, power); },
    });
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') setAngle(angle - 0.05);
      if (e.key === 'ArrowDown') setAngle(angle + 0.05);
      if (e.key === ' ' && turn === 'me' && state === 'play') fire('me', angle, power);
    });

    function start() { score = { me: 0, cpu: 0 }; newRound(); state = 'play'; }
    newRound();
    W.overlay({ title: '💣 Artillery', text: 'Crown (or drag) sets angle.<br>Tap to fire when the power<br>is right. Mind the wind!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
