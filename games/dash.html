<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Dash</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    // A cube auto-runs; tap to jump over spikes and onto blocks. Hold to keep jumping.
    let cube, obs, speed, dist, spawnX, state = 'ready', holding = false, hue = 200, parts = [];
    const S = () => view.h * 0.08, GROUND = () => view.h * 0.78;

    function reset() { cube = { y: 0, vy: 0, rot: 0, onGround: true }; obs = []; speed = view.w * 0.8; dist = 0; spawnX = view.w; hud.textContent = '0%'; }

    function addPattern(x) {
      const s = S(), k = W.randInt(0, 4);
      if (k === 0) obs.push({ x, w: s, h: s, spike: true });
      else if (k === 1) { obs.push({ x, w: s, h: s, spike: true }); obs.push({ x: x + s, w: s, h: s, spike: true }); }
      else if (k === 2) obs.push({ x, w: s * 2, h: s, spike: false });
      else if (k === 3) { obs.push({ x, w: s * 1.5, h: s, spike: false }); obs.push({ x: x + s * 1.5, w: s, h: s, spike: true }); }
      else obs.push({ x, w: s, h: s * 1.7, spike: false });
      return x + s * W.rand(5, 8);
    }

    function jump() { if (cube.onGround) { cube.vy = -view.h * 1.55; cube.onGround = false; } }

    function update(dt) {
      speed += view.w * 0.01 * dt;
      dist += speed * dt;
      hud.textContent = Math.floor(dist / view.w * 10);
      if (holding) jump();
      const s = S(), g = GROUND(), cx = view.w * 0.25;
      cube.vy += view.h * 5 * dt;
      cube.y += cube.vy * dt;
      cube.onGround = false;
      let floor = 0;   // height of whatever is under the cube
      for (const o of obs) {
        o.x -= speed * dt;
        if (cx + s / 2 > o.x + 2 && cx - s / 2 < o.x + o.w - 2) {
          const top = o.h;
          if (o.spike) { if (-cube.y - 0 < top * 0.7) return die(); }
          else if (-cube.y >= top - 6 && cube.vy >= 0) floor = Math.max(floor, top);
          else if (-cube.y < top - 6) return die();   // hit the side of a block
        }
      }
      if (-cube.y <= floor) { cube.y = -floor; cube.vy = 0; cube.onGround = true; }
      cube.rot = cube.onGround ? Math.round(cube.rot / (Math.PI / 2)) * (Math.PI / 2) : cube.rot + dt * 7;
      spawnX -= speed * dt;
      while (spawnX < view.w * 1.5) spawnX = addPattern(spawnX + view.w * 0.2);
      obs = obs.filter(o => o.x + o.w > -10);
      if (cube.onGround && W.rng() < 0.4) parts.push({ x: cx - s / 2, y: g + cube.y, t: 0.3 });
    }
    function die() {
      state = 'over';
      for (let i = 0; i < 20; i++) parts.push({ x: view.w * 0.25, y: GROUND() + cube.y - S() / 2, vx: W.rand(-120, 120), vy: W.rand(-160, 40), t: 0.7 });
      const sc = Math.floor(dist / view.w * 10), best = W.best('dash', sc);
      setTimeout(() => W.overlay({ title: 'Crashed!', big: sc, text: `Best ${best}`, button: 'Again', onStart: start }), 600);
    }

    function render(dt) {
      const { w, h } = view;
      hue = (hue + dt * 10) % 360;
      const g0 = ctx.createLinearGradient(0, 0, 0, h);
      g0.addColorStop(0, `hsl(${hue},70%,25%)`); g0.addColorStop(1, `hsl(${(hue + 40) % 360},70%,12%)`);
      ctx.fillStyle = g0; ctx.fillRect(0, 0, w, h);
      const g = GROUND(), s = S();
      ctx.fillStyle = `hsl(${hue},60%,10%)`; ctx.fillRect(0, g, w, h - g);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, g, w, 2);
      for (const o of obs) {
        if (o.spike) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.moveTo(o.x, g); ctx.lineTo(o.x + o.w / 2, g - o.h); ctx.lineTo(o.x + o.w, g); ctx.fill();
        } else {
          ctx.fillStyle = `hsl(${hue},60%,8%)`; ctx.fillRect(o.x, g - o.h, o.w, o.h);
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(o.x, g - o.h, o.w, o.h);
        }
      }
      for (const p of parts) { p.t -= dt; if (p.vx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; } else p.x -= speed * dt; ctx.fillStyle = `rgba(255,214,10,${Math.max(0, p.t * 2)})`; ctx.fillRect(p.x, p.y - 3, 3, 3); }
      parts = parts.filter(p => p.t > 0);
      if (state !== 'over') {
        ctx.save(); ctx.translate(w * 0.25, g + cube.y - s / 2); ctx.rotate(cube.rot);
        ctx.fillStyle = '#ffd60a'; ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.fillStyle = '#000'; ctx.fillRect(-s * 0.3, -s * 0.2, s * 0.18, s * 0.18); ctx.fillRect(s * 0.12, -s * 0.2, s * 0.18, s * 0.18); ctx.fillRect(-s * 0.25, s * 0.15, s * 0.5, s * 0.1);
        ctx.restore();
      }
    }

    W.pointer(canvas, { down: () => { holding = true; jump(); }, up: () => (holding = false) });
    window.addEventListener('keydown', e => { if (e.key === ' ') { holding = true; jump(); } });
    window.addEventListener('keyup', e => { if (e.key === ' ') holding = false; });
    function start() { reset(); state = 'play'; }
    reset();
    W.overlay({ title: '🟨 Dash', text: 'Tap (or hold) to jump.<br>Land on blocks, avoid spikes!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
