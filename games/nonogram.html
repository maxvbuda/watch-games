<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Nonogram</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>
    #area { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-top: 26px; }
    #board { display: grid; gap: 2px; --c: min(calc((96vw - 44px) / 5), calc((100vh - 76px) / 5)); grid-template-columns: 40px repeat(5, var(--c)); grid-template-rows: 40px repeat(5, var(--c)); }
    .clue { font-size: 10px; font-weight: 700; color: #8e8e93; display: flex; align-items: flex-end; justify-content: center; line-height: 1.1; text-align: center; }
    .clue.row { justify-content: flex-end; align-items: center; padding-right: 4px; letter-spacing: 1px; }
    .clue.col { flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 2px; }
    .clue.done { color: #30d158; }
    .cell { border-radius: 4px; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #636366; }
    .cell.on { background: #0a84ff; }
    .cell.won { background: #30d158; }
  </style>
</head>
<body class="game">
  <div id="area"><div id="board"></div></div>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const N = 5;
    const $ = id => document.getElementById(id);
    let sol, marks, done, solved = 0, startT;   // marks: 0 empty, 1 filled, 2 crossed

    const runs = line => { const r = []; let n = 0; for (const v of line) { if (v) n++; else if (n) { r.push(n); n = 0; } } if (n) r.push(n); return r.length ? r : [0]; };
    const row = (g, y) => g.slice(y * N, y * N + N);
    const col = (g, x) => Array.from({ length: N }, (_, y) => g[y * N + x]);
    const same = (a, b) => a.join() === b.join();

    function build() {
      const b = $('board');
      b.innerHTML = '<div></div>';
      for (let x = 0; x < N; x++) b.insertAdjacentHTML('beforeend', `<div class="clue col" id="cc${x}">${runs(col(sol, x)).join('<br>')}</div>`);
      for (let y = 0; y < N; y++) {
        b.insertAdjacentHTML('beforeend', `<div class="clue row" id="rc${y}">${runs(row(sol, y)).join(' ')}</div>`);
        for (let x = 0; x < N; x++) {
          const d = document.createElement('div');
          d.className = 'cell';
          d.id = 'c' + (y * N + x);
          d.addEventListener('click', () => tap(y * N + x));
          b.appendChild(d);
        }
      }
    }

    function tap(i) {
      if (done) return;
      marks[i] = (marks[i] + 1) % 3;   // empty → filled → ✕ → empty
      draw();
      const filled = marks.map(m => (m === 1 ? 1 : 0));
      // Solved when every row and column matches its clue (any valid picture counts).
      const ok = [...Array(N).keys()].every(k => same(runs(row(filled, k)), runs(row(sol, k))) && same(runs(col(filled, k)), runs(col(sol, k))));
      if (ok) {
        done = true; solved++;
        const secs = Math.round((Date.now() - startT) / 1000);
        W.best('nonogram', solved);
        marks.forEach((m, j) => $('c' + j).classList.toggle('won', m === 1));
        setTimeout(() => W.overlay({ title: 'Solved! 🖼️', big: secs + 's', text: `${solved} solved this session`, button: 'Next puzzle', onStart: start }), 600);
      }
    }

    function draw() {
      marks.forEach((m, i) => { const d = $('c' + i); d.className = 'cell' + (m === 1 ? ' on' : ''); d.textContent = m === 2 ? '✕' : ''; });
      const filled = marks.map(m => (m === 1 ? 1 : 0));
      for (let k = 0; k < N; k++) {
        $('rc' + k).classList.toggle('done', same(runs(row(filled, k)), runs(row(sol, k))));
        $('cc' + k).classList.toggle('done', same(runs(col(filled, k)), runs(col(sol, k))));
      }
      $('hud').innerHTML = `${solved}<small>solved</small>`;
    }

    function start() {
      do sol = Array.from({ length: N * N }, () => (Math.random() < 0.58 ? 1 : 0));
      while (sol.filter(Boolean).length < 9 || [...Array(N).keys()].some(k => !row(sol, k).some(Boolean)));
      marks = new Array(N * N).fill(0);
      done = false; startT = Date.now();
      build(); draw();
    }
    start();
    W.overlay({ title: '🖼️ Nonogram', text: 'Numbers show runs of filled<br>squares in each row/column.<br>Tap: fill → ✕ → clear.', onStart() {} });
  </script>
</body>
</html>
