<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Nim</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>
    #area { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 30px 6px max(6px, env(safe-area-inset-bottom)); gap: 4px; }
    #rows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .row { display: flex; justify-content: center; gap: 4px; min-height: 30px; }
    .m { font-size: 24px; line-height: 1; transition: transform 0.15s, opacity 0.2s; }
    .m.sel { transform: translateY(-5px) scale(1.15); filter: drop-shadow(0 0 4px #ffd60a); }
    .m.gone { opacity: 0; pointer-events: none; }
    #msg { text-align: center; font-size: 11px; color: var(--muted); min-height: 14px; }
    #take { border: 0; border-radius: 18px; background: #ffd60a; color: #000; font: inherit; font-size: 14px; font-weight: 800; padding: 8px; }
    #take:disabled { opacity: 0.3; }
  </style>
</head>
<body class="game">
  <div id="area">
    <div id="rows"></div>
    <div id="msg"></div>
    <button id="take">Take</button>
  </div>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    // Nim (misère-free): take any number of matches from ONE row. Whoever takes the last match wins.
    const $ = id => document.getElementById(id);
    let rows, sel, busy, tally = { w: 0, l: 0 };

    function draw() {
      $('rows').innerHTML = '';
      rows.forEach((n, r) => {
        const row = document.createElement('div');
        row.className = 'row';
        for (let i = 0; i < n; i++) {
          const m = document.createElement('span');
          m.className = 'm' + (sel && sel.r === r && i >= n - sel.n ? ' sel' : '');
          m.textContent = '🕯️';
          m.addEventListener('click', () => pick(r, n - i));
          row.appendChild(m);
        }
        $('rows').appendChild(row);
      });
      $('take').disabled = !sel || busy;
      $('take').textContent = sel ? `Take ${sel.n}` : 'Tap candles to select';
      $('hud').innerHTML = `${tally.w}–${tally.l}`;
    }

    // Tapping a candle selects it and every candle to its right in that row.
    function pick(r, n) { if (busy) return; sel = { r, n }; draw(); }

    function take() {
      if (!sel || busy) return;
      rows[sel.r] -= sel.n;
      sel = null;
      if (check('you')) return;
      busy = true;
      $('msg').textContent = 'Watch is thinking…';
      draw();
      setTimeout(aiMove, 700);
    }

    function aiMove() {
      // Perfect play: make the XOR of the rows zero if possible; sometimes blunder so it's beatable.
      const x = rows.reduce((a, b) => a ^ b, 0);
      let r, n;
      if (x !== 0 && Math.random() > 0.25) {
        r = rows.findIndex(v => (v ^ x) < v);
        n = rows[r] - (rows[r] ^ x);
      } else {
        const nonEmpty = rows.map((v, i) => i).filter(i => rows[i] > 0);
        r = W.pick(nonEmpty);
        n = W.randInt(1, rows[r]);
      }
      rows[r] -= n;
      $('msg').textContent = `Watch took ${n} from row ${r + 1}`;
      busy = false;
      if (check('watch')) return;
      draw();
    }

    function check(who) {
      if (rows.some(v => v > 0)) return false;
      busy = true;
      if (who === 'you') { tally.w++; W.best('nim', tally.w); } else tally.l++;
      draw();
      setTimeout(() => W.overlay({ title: who === 'you' ? 'You took the last one! 🎉' : 'Watch took the last one 🤖', text: `Session ${tally.w}–${tally.l}`, button: 'Again', onStart: start }), 400);
      return true;
    }

    $('take').addEventListener('click', take);
    function start() { rows = [1, 3, 5, 7]; sel = null; busy = false; $('msg').textContent = 'Take from one row. Last candle wins!'; draw(); }
    start();
  </script>
</body>
</html>
