<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Home Run Derby</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    const OUTS = 10;

    // Derby rules: anything that isn't a home run is an out. How many homers before 10 outs?
    let pitch, hit, swing, hrs, outs, streak, state = 'ready', msg = '', msgT = 0, waitT = 0;
    const MOUND = () => ({ x: view.w / 2, y: view.h * 0.32 }), PLATE = () => ({ x: view.w / 2, y: view.h * 0.84 });

    function newPitch() {
      const kind = W.pick(['fast', 'fast', 'change', 'curve']);
      pitch = { t: 0, dur: kind === 'fast' ? W.rand(0.62, 0.75) : kind === 'change' ? W.rand(0.95, 1.1) : W.rand(0.8, 0.9), kind, curve: kind === 'curve' ? W.rand(-1, 1) * view.w * 0.15 : 0, swung: false };
      hit = null; swing = 0;
    }
    function updateHud() { hud.innerHTML = `${hrs} HR<small>${OUTS - outs} outs left</small>`; }

    function doSwing() {
      if (state !== 'play' || !pitch || pitch.swung) return;
      pitch.swung = true;
      swing = 0.25;
      const err = pitch.t - 1;   // 0 = ball exactly at the plate
      const a = Math.abs(err);
      if (a < 0.045) result('HR', err);
      else if (a < 0.1) result('hit', err);
      else if (a < 0.15) result('foul', err);
      else result('whiff', err);
    }

    function result(r, err) {
      if (r === 'HR') { hrs++; streak++; msg = streak >= 3 ? `HOME RUN! 🔥×${streak}` : 'HOME RUN! 💥'; }
      else { outs++; streak = 0; msg = r === 'hit' ? (err < 0 ? 'Pulled — caught' : 'Pop fly — out') : r === 'foul' ? 'Foul ball — out' : 'Swing & miss!'; }
      if (r !== 'whiff') {
        const dir = W.clamp(-err * 12, -1.2, 1.2);   // early swings pull left, late push right
        hit = { t: 0, dir, power: r === 'HR' ? 1 : r === 'hit' ? 0.6 : 0.35, x: PLATE().x, y: PLATE().y };
        pitch = null;
      }
      msgT = 1.2;
      updateHud();
      waitT = 1.4;
    }

    function update(dt) {
      if (pitch) {
        pitch.t += dt / pitch.dur;
        if (pitch.t > 1.25 && !pitch.swung) { pitch.swung = true; outs++; streak = 0; msg = 'Strike — out!'; msgT = 1; updateHud(); waitT = 0.8; }
      }
      if (hit) hit.t += dt;
      swing = Math.max(0, swing - dt);
      if (waitT > 0) {
        waitT -= dt;
        if (waitT <= 0) {
          if (outs >= OUTS) {
            state = 'over';
            const best = W.best('homerun', hrs);
            W.overlay({ title: 'Derby over! ⚾️', big: hrs + ' HR', text: `Best ${best}`, button: 'Again', onStart: start });
          } else newPitch();
        }
      }
    }

    function render(dt) {
      const { w, h } = view;
      // Field: grass, dirt diamond, night sky.
      const g = ctx.createLinearGradient(0, 0, 0, h * 0.25);
      g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#1f3b73');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, h * 0.22, w, h);
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(0, h * 0.2, w, h * 0.03);   // outfield wall
      ctx.fillStyle = '#c48a50';
      ctx.beginPath(); ctx.moveTo(w / 2, h * 0.5); ctx.lineTo(w * 0.95, h * 0.9); ctx.lineTo(w / 2, h * 1.05); ctx.lineTo(w * 0.05, h * 0.9); ctx.closePath(); ctx.fill();
      const m = MOUND(), p = PLATE();
      ctx.fillStyle = '#a8703c'; ctx.beginPath(); ctx.ellipse(m.x, m.y + 6, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(p.x - 7, p.y); ctx.lineTo(p.x + 7, p.y); ctx.lineTo(p.x + 7, p.y + 4); ctx.lineTo(p.x, p.y + 8); ctx.lineTo(p.x - 7, p.y + 4); ctx.fill();
      // Stadium lights.
      for (const x of [w * 0.1, w * 0.9]) { ctx.fillStyle = '#fff9c4'; ctx.fillRect(x - 6, h * 0.05, 12, 5); }

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
      ctx.font = '20px sans-serif';
      ctx.fillText('🧢', m.x, m.y - 6);

      if (pitch && pitch.t <= 1.3) {
        const t = Math.min(pitch.t, 1.3);
        const x = m.x + pitch.curve * Math.sin(Math.PI * Math.min(t, 1)) * 0.9, y = m.y + (p.y - m.y) * t;
        const r = 2.5 + t * 4.5;
        ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(x, y + r + 2, r, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ff453a'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(x - r * 0.5, y, r * 0.7, -0.8, 0.8); ctx.stroke();
      }
      if (hit) {
        // Ball flies out toward the wall (and over it for a homer).
        const t = Math.min(hit.t / 1.2, 1);
        const dist = hit.power * (p.y - h * 0.12);
        const x = p.x + Math.sin(hit.dir) * dist * t * 0.8, y = p.y - Math.cos(hit.dir) * dist * t - Math.sin(Math.PI * t) * 30 * hit.power;
        const r = Math.max(1.5, 6 - t * 4.5);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      // Bat: swings across the plate.
      ctx.save();
      ctx.translate(p.x + 20, p.y - 6);
      ctx.rotate(swing > 0 ? -Math.PI * 0.2 - (0.25 - swing) * 10 : -Math.PI * 0.2);
      ctx.fillStyle = '#d9a066';
      ctx.fillRect(-32, -2.5, 32, 5);
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-4, -2, 6, 4);
      ctx.restore();

      if (msgT > 0) {
        msgT -= dt;
        ctx.globalAlpha = Math.min(1, msgT * 3);
        ctx.fillStyle = msg.startsWith('HOME') ? '#ffd60a' : '#fff';
        ctx.font = '800 15px -apple-system, system-ui';
        ctx.fillText(msg, w / 2, h * 0.6);
        ctx.globalAlpha = 1;
      }
      if (pitch && state === 'play' && hrs + outs === 0 && pitch.t < 0.3) {
        ctx.fillStyle = '#fff'; ctx.font = '600 11px -apple-system, system-ui';
        ctx.fillText('Tap to swing as it reaches the plate', w / 2, h * 0.62);
      }
    }

    W.pointer(canvas, { down: doSwing });
    window.addEventListener('keydown', e => { if (e.key === ' ') doSwing(); });

    function start() { hrs = 0; outs = 0; streak = 0; updateHud(); state = 'play'; waitT = 0.6; pitch = null; hit = null; }
    hrs = 0; outs = 0; streak = 0; updateHud();
    W.overlay({ title: '⚾️ Home Run Derby', text: 'Tap to swing. Perfect timing<br>= home run. Watch for<br>changeups and curves!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
