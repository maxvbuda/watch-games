<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Hop</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const COLS = 7;
    let cell;
    const view = W.setupCanvas(canvas, w => (cell = w / COLS));
    const ctx = view.ctx;
    const CARS = ['🚗', '🚕', '🚙', '🚌', '🚓'];

    let lanes, px, row, best, cam, state = 'ready', hopT = 0;

    function makeLane(r) {
      if (r < 3) return { type: 'grass', trees: [] };
      const prev = lanes[r - 1];
      const roll = Math.random();
      const diff = Math.min(r / 80, 1);
      let type = roll < 0.3 ? 'grass' : roll < 0.72 ? 'road' : 'river';
      if (prev && prev.type === 'river' && type === 'river' && Math.random() < 0.5) type = 'grass';
      const dir = Math.random() < 0.5 ? 1 : -1;
      if (type === 'grass') {
        const trees = [];
        for (let c = 0; c < COLS; c++) if (Math.random() < 0.2) trees.push(c);
        return { type, trees };
      }
      if (type === 'road') {
        const speed = W.rand(1.2, 2.4) * (1 + diff);
        const n = W.randInt(1, 3), items = [];
        const spacing = (COLS + 4) / n;
        const big = Math.random() < 0.3;
        for (let i = 0; i < n; i++) items.push({ x: i * spacing + W.rand(0, 1), w: big ? 2 : 1, e: big ? '🚌' : W.pick(CARS) });
        return { type, dir, speed, items };
      }
      const speed = W.rand(0.8, 1.6) * (1 + diff * 0.5);
      const n = W.randInt(2, 3), items = [];
      const spacing = (COLS + 4) / n;
      for (let i = 0; i < n; i++) items.push({ x: i * spacing, w: W.randInt(2, 3) });
      return { type, dir, speed, items };
    }

    function laneAt(r) { while (lanes.length <= r) lanes.push(makeLane(lanes.length)); return lanes[r]; }

    function reset() {
      lanes = [];
      px = 3; row = 0; best = 0; cam = 0;
      // Clear trees off the start column.
      for (let r = 0; r < 3; r++) laneAt(r);
      hud.textContent = '0';
    }

    function blocked(r, c) {
      const l = laneAt(r);
      return l.type === 'grass' && l.trees.includes(c);
    }

    function hop(d) {
      if (state !== 'play') return;
      let nr = row, nc = Math.round(px);
      if (d === 'up') nr++;
      if (d === 'down') nr = Math.max(0, row - 1);
      if (d === 'left') nc--;
      if (d === 'right') nc++;
      if (nc < 0 || nc >= COLS || blocked(nr, nc)) return;
      row = nr;
      px = d === 'up' || d === 'down' ? Math.round(px) : nc;
      hopT = 0.12;
      if (row > best) { best = row; hud.textContent = best; }
    }

    function update(dt) {
      const span = COLS + 4;
      for (let r = Math.max(0, row - 4); r < row + 12; r++) {
        const l = laneAt(r);
        if (!l.items) continue;
        for (const it of l.items) {
          it.x += l.dir * l.speed * dt;
          if (it.x > COLS + 2) it.x -= span;
          if (it.x < -2 - it.w) it.x += span;
        }
      }
      const l = laneAt(row);
      const cx = px + 0.5;
      if (l.type === 'road' && l.items.some(it => cx > it.x + 0.15 && cx < it.x + it.w - 0.15)) return die('Squashed! 🚗');
      if (l.type === 'river') {
        const log = l.items.find(it => cx > it.x - 0.1 && cx < it.x + it.w + 0.1);
        if (!log) return die('Splash! 🌊');
        px += l.dir * l.speed * dt;   // ride the log
        if (px < -0.4 || px > COLS - 0.6) return die('Swept away! 🌊');
      }
      // Camera creeps forward so you can't dawdle.
      cam = Math.max(cam + dt * (0.35 + Math.min(best, 80) * 0.006), row - 2.5);
      if (row < cam - 1.2) return die('Too slow! 🦅');
      hopT = Math.max(0, hopT - dt);
    }

    function die(msg) {
      state = 'over';
      const b = W.best('hop', best);
      setTimeout(() => W.overlay({ title: msg, big: best, text: `Best ${b}`, button: 'Again', onStart: start }), 500);
    }

    const sy = r => view.h - (r - cam) * cell - cell * 2.2;

    function render() {
      const { w, h } = view;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const r0 = Math.floor(cam - 3), r1 = Math.ceil(cam + h / cell + 1);
      for (let r = r0; r <= r1; r++) {
        const y = sy(r);
        if (r < 0) { ctx.fillStyle = '#3f9b3f'; ctx.fillRect(0, y, w, cell + 0.5); continue; }
        const l = laneAt(r);
        ctx.fillStyle = l.type === 'grass' ? (r % 2 ? '#3f9b3f' : '#48a848') : l.type === 'road' ? '#3a3a3c' : '#1e6fd9';
        ctx.fillRect(0, y, w, cell + 0.5);
        ctx.font = `${Math.round(cell * 0.85)}px sans-serif`;
        if (l.type === 'grass') for (const c of l.trees) ctx.fillText('🌳', (c + 0.5) * cell, y + cell / 2);
        if (l.type === 'road') {
          ctx.fillStyle = '#ffffff33';
          for (let x = 0; x < w; x += cell) ctx.fillRect(x + 4, y + cell - 1, cell / 2, 1);
          ctx.fillStyle = '#000';   // emoji inherit fill alpha, so reset it
          for (const it of l.items) {
            ctx.save();
            ctx.translate((it.x + it.w / 2) * cell, y + cell / 2);
            if (l.dir > 0) ctx.scale(-1, 1);   // emoji vehicles face left
            ctx.font = `${Math.round(cell * (it.w > 1 ? 1.5 : 0.9))}px sans-serif`;
            ctx.fillText(it.e, 0, 0);
            ctx.restore();
          }
        }
        if (l.type === 'river') {
          for (const it of l.items) {
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(it.x * cell + 2, y + 4, it.w * cell - 4, cell - 8);
            ctx.fillStyle = '#6b4220';
            ctx.fillRect(it.x * cell + 2, y + cell / 2 - 1, it.w * cell - 4, 2);
          }
        }
      }
      {
        ctx.fillStyle = '#000';
        ctx.font = `${Math.round(cell * 0.9)}px sans-serif`;
        ctx.fillText('🐔', (px + 0.5) * cell, sy(row) + cell / 2 - hopT * 40);
      }
    }

    W.swipe(canvas, hop, () => hop('up'));
    function start() { reset(); state = 'play'; }
    reset();
    W.overlay({ title: '🐔 Hop', text: 'Tap to hop forward.<br>Swipe to hop sideways/back.<br>Watch for cars & water!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(); });
  </script>
</body>
</html>
