<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Breakout</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    const COLS = 6, ROWS = 5, TOP = 36;
    const ROW_COLORS = ['#ff453a', '#ff9f0a', '#ffd60a', '#30d158', '#0a84ff', '#bf5af2'];

    let paddle, ball, bricks, score, lives, level, state = 'ready', stuck;
    const PW = () => view.w * 0.3;
    const PH = () => Math.max(5, view.h * 0.025);
    const PY = () => view.h - PH() - 10;
    const BR = () => Math.max(3.5, view.w * 0.022);

    function buildLevel() {
      bricks = [];
      const gap = 2;
      const bw = (view.w - gap * (COLS + 1)) / COLS;
      const bh = view.h * 0.045;
      for (let r = 0; r < ROWS + Math.min(level - 1, 3); r++) {
        for (let c = 0; c < COLS; c++) {
          // Later levels have tougher (2-hit) bricks in the top rows.
          const hp = level > 1 && r < level - 1 ? 2 : 1;
          bricks.push({ x: gap + c * (bw + gap), y: TOP + r * (bh + gap), w: bw, h: bh, hp, color: ROW_COLORS[r % ROW_COLORS.length] });
        }
      }
    }

    function resetBall() {
      stuck = true;
      ball = { x: paddle.x, y: PY() - BR(), vx: 0, vy: 0 };
    }

    function launch() {
      if (!stuck || state !== 'play') return;
      stuck = false;
      const sp = view.h * (0.75 + (level - 1) * 0.08);
      const a = W.rand(-0.4, 0.4);
      ball.vx = Math.sin(a) * sp;
      ball.vy = -Math.cos(a) * sp;
    }

    function updateHud() {
      hud.innerHTML = `${score}<small>${'♥'.repeat(lives)} · L${level}</small>`;
    }

    function update(dt) {
      if (stuck) { ball.x = paddle.x; ball.y = PY() - BR(); return; }
      // Sub-step so a fast ball can't tunnel through a brick.
      const steps = 3;
      for (let s = 0; s < steps; s++) step(dt / steps);
    }

    function step(dt) {
      const r = BR();
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > view.w - r) { ball.x = view.w - r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < r + 30) { ball.y = r + 30; ball.vy = Math.abs(ball.vy); }

      const py = PY(), pw = PW();
      if (ball.vy > 0 && ball.y + r >= py && ball.y - r <= py + PH() && Math.abs(ball.x - paddle.x) <= pw / 2 + r) {
        const off = W.clamp((ball.x - paddle.x) / (pw / 2), -1, 1);
        const sp = Math.hypot(ball.vx, ball.vy);
        ball.vx = Math.sin(off * 1.05) * sp;
        ball.vy = -Math.cos(off * 1.05) * sp;
        ball.y = py - r;
      }

      for (const b of bricks) {
        if (b.hp <= 0) continue;
        if (ball.x + r < b.x || ball.x - r > b.x + b.w || ball.y + r < b.y || ball.y - r > b.y + b.h) continue;
        // Bounce off the side with the smallest overlap.
        const ox = Math.min(ball.x + r - b.x, b.x + b.w - (ball.x - r));
        const oy = Math.min(ball.y + r - b.y, b.y + b.h - (ball.y - r));
        if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
        b.hp--;
        score += 10;
        updateHud();
        break;
      }

      if (bricks.every(b => b.hp <= 0)) {
        level++;
        buildLevel();
        resetBall();
        updateHud();
        return;
      }

      if (ball.y - r > view.h) {
        lives--;
        updateHud();
        if (lives <= 0) {
          state = 'over';
          const best = W.best('breakout', score);
          W.overlay({ title: 'Game over', big: score, text: `Best ${best}`, button: 'Again', onStart: start });
        } else resetBall();
      }
    }

    function render() {
      const { w, h } = view;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        ctx.fillStyle = b.color;
        ctx.globalAlpha = b.hp > 1 ? 1 : 0.85;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (b.hp > 1) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
        }
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#e5e5ea';
      const pw = PW();
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(paddle.x - pw / 2, PY(), pw, PH(), 3) : ctx.rect(paddle.x - pw / 2, PY(), pw, PH());
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BR(), 0, Math.PI * 2); ctx.fill();
      if (stuck && state === 'play') {
        ctx.fillStyle = '#8e8e93';
        ctx.font = `600 ${Math.round(h * 0.055)}px -apple-system, system-ui`;
        ctx.textAlign = 'center';
        ctx.fillText('Tap to launch', w / 2, h * 0.68);
      }
    }

    function movePaddle(p) { paddle.x = W.clamp(p.x, PW() / 2, view.w - PW() / 2); }
    let downAt = 0;
    W.pointer(canvas, {
      down(p) { downAt = Date.now(); movePaddle(p); },
      move: movePaddle,
      up() { if (Date.now() - downAt < 300) launch(); },
    });
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') launch(); });
    window.addEventListener('keyup', e => (keys[e.key] = false));

    function start() {
      score = 0;
      lives = 3;
      level = 1;
      paddle = { x: view.w / 2 };
      buildLevel();
      resetBall();
      updateHud();
      state = 'play';
    }

    start();
    state = 'ready';
    W.overlay({ title: '🟪 Breakout', text: 'Slide to move the paddle.<br>Tap to launch.', onStart: start });

    W.loop(dt => {
      if (keys.ArrowLeft) paddle.x -= view.w * 1.5 * dt;
      if (keys.ArrowRight) paddle.x += view.w * 1.5 * dt;
      paddle.x = W.clamp(paddle.x, PW() / 2, view.w - PW() / 2);
      if (state === 'play') update(dt);
      render();
    });
  </script>
</body>
</html>
