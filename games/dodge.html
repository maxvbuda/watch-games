<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Asteroid Dodge</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;

    let ship, rocks, stars, sparks, score, elapsed, spawnT, starT, state = 'ready';
    const bg = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), s: W.rand(0.2, 1) }));
    const SR = () => view.w * 0.055;

    function reset() {
      ship = { x: view.w / 2, y: view.h - view.h * 0.14 };
      rocks = [];
      stars = [];
      sparks = [];
      score = 0;
      elapsed = 0;
      spawnT = 0.5;
      starT = 3;
    }

    function spawnRock() {
      const r = view.w * W.rand(0.04, 0.09);
      const speed = view.h * (0.45 + Math.min(elapsed, 60) * 0.018) * W.rand(0.8, 1.25);
      const pts = Array.from({ length: 8 }, () => W.rand(0.75, 1.1));
      rocks.push({ x: W.rand(r, view.w - r), y: -r, r, vy: speed, vx: W.rand(-0.1, 0.1) * view.w, rot: 0, vr: W.rand(-3, 3), pts });
    }

    function update(dt) {
      elapsed += dt;
      score += dt * 10;
      spawnT -= dt;
      if (spawnT <= 0) {
        spawnRock();
        spawnT = Math.max(0.16, 0.6 - elapsed * 0.009) * W.rand(0.7, 1.3);
      }
      starT -= dt;
      if (starT <= 0) {
        stars.push({ x: W.rand(15, view.w - 15), y: -10, vy: view.h * 0.4 });
        starT = W.rand(3, 6);
      }

      const sr = SR();
      for (const r of rocks) {
        r.y += r.vy * dt;
        r.x += r.vx * dt;
        r.rot += r.vr * dt;
        if (Math.hypot(r.x - ship.x, r.y - ship.y) < r.r * 0.85 + sr * 0.7) return crash();
      }
      rocks = rocks.filter(r => r.y - r.r < view.h);

      for (const s of stars) {
        s.y += s.vy * dt;
        if (Math.hypot(s.x - ship.x, s.y - ship.y) < sr + 10) {
          s.got = true;
          score += 50;
          for (let i = 0; i < 10; i++) sparks.push({ x: s.x, y: s.y, vx: W.rand(-80, 80), vy: W.rand(-80, 80), t: 0.5 });
        }
      }
      stars = stars.filter(s => !s.got && s.y < view.h + 10);
      hud.textContent = Math.floor(score);
    }

    function crash() {
      state = 'over';
      for (let i = 0; i < 30; i++) sparks.push({ x: ship.x, y: ship.y, vx: W.rand(-150, 150), vy: W.rand(-150, 150), t: 0.9, c: '#ff9f0a' });
      const s = Math.floor(score);
      const best = W.best('dodge', s);
      setTimeout(() => W.overlay({ title: '💥 Hit!', big: s, text: `Best ${best}`, button: 'Again', onStart: start }), 800);
    }

    function render(dt) {
      const { w, h } = view;
      ctx.fillStyle = '#02020a';
      ctx.fillRect(0, 0, w, h);
      for (const b of bg) {
        b.y += b.s * dt * 0.15;
        if (b.y > 1) b.y -= 1;
        ctx.fillStyle = `rgba(255,255,255,${b.s * 0.7})`;
        ctx.fillRect(b.x * w, b.y * h, b.s * 1.6, b.s * 1.6);
      }

      for (const r of rocks) {
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.rot);
        ctx.fillStyle = '#6e5a4a';
        ctx.strokeStyle = '#a08672';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        r.pts.forEach((p, i) => {
          const a = (i / r.pts.length) * Math.PI * 2;
          ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r.r * p, Math.sin(a) * r.r * p);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const s of stars) ctx.fillText('⭐️', s.x, s.y);

      if (state !== 'over') {
        const sr = SR();
        ctx.save();
        ctx.translate(ship.x, ship.y);
        // Engine flame.
        ctx.fillStyle = Math.random() < 0.5 ? '#ff9f0a' : '#ffd60a';
        ctx.beginPath(); ctx.moveTo(-sr * 0.4, sr * 0.8); ctx.lineTo(0, sr * (1.5 + Math.random() * 0.5)); ctx.lineTo(sr * 0.4, sr * 0.8); ctx.fill();
        ctx.fillStyle = '#e5e5ea';
        ctx.beginPath(); ctx.moveTo(0, -sr * 1.3); ctx.lineTo(sr, sr); ctx.lineTo(0, sr * 0.6); ctx.lineTo(-sr, sr); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#64d2ff';
        ctx.beginPath(); ctx.arc(0, -sr * 0.2, sr * 0.28, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.t -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.t <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = p.c || '#ffd60a';
        ctx.globalAlpha = Math.min(1, p.t * 2);
        ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      }
      ctx.globalAlpha = 1;
    }

    // Relative drag: the ship moves with your finger but stays visible above it.
    let last = null;
    W.pointer(canvas, {
      down(p) { last = p; },
      move(p) {
        if (!last || state !== 'play') return;
        ship.x = W.clamp(ship.x + (p.x - last.x) * 1.4, SR(), view.w - SR());
        ship.y = W.clamp(ship.y + (p.y - last.y) * 1.4, view.h * 0.35, view.h - SR() * 1.6);
        last = p;
      },
      up() { last = null; },
    });
    const keys = {};
    window.addEventListener('keydown', e => (keys[e.key] = true));
    window.addEventListener('keyup', e => (keys[e.key] = false));

    function start() {
      reset();
      state = 'play';
    }

    reset();
    W.overlay({ title: '☄️ Asteroid Dodge', text: 'Drag anywhere to fly.<br>Grab ⭐️ for +50.', onStart: start });

    W.loop(dt => {
      if (state === 'play') {
        const k = view.w * 1.3 * dt;
        if (keys.ArrowLeft) ship.x -= k;
        if (keys.ArrowRight) ship.x += k;
        ship.x = W.clamp(ship.x, SR(), view.w - SR());
        update(dt);
      }
      render(dt);
    });
  </script>
</body>
</html>
