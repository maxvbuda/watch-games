<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Beach Buggy</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>
    .hud { text-align: right; }
    #pos { position: fixed; left: 38px; top: max(6px, env(safe-area-inset-top)); z-index: 10; font-weight: 900; font-size: 20px; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #pos small { font-size: 11px; }
    #item {
      position: fixed; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 10;
      width: 42px; height: 42px; border-radius: 12px; border: 2px solid #ffffffaa; background: #0008;
      font-size: 22px; display: flex; align-items: center; justify-content: center; color: #fff;
    }
    #item.has { border-color: #ffd60a; background: #ffd60a44; }
  </style>
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div id="pos"></div>
  <div class="hud" id="hud"></div>
  <button id="item" aria-label="Use item"></button>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const posEl = document.getElementById('pos');
    const itemBtn = document.getElementById('item');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    const TAU = Math.PI * 2;
    const LAPS = 3, TW = 74;   // track width (world units)
    const ITEMS = [
      { k: 'boost', e: '🔥' }, { k: 'rocket', e: '🚀' }, { k: 'oil', e: '🛢️' }, { k: 'shield', e: '🛡️' }, { k: 'triple', e: '⚡' },
    ];

    // ---- Track: a closed Catmull-Rom loop through these points ----
    const CTRL = [[200, 150], [520, 90], [840, 160], [940, 380], [800, 540], [580, 470], [470, 620], [640, 790], [380, 860], [150, 720], [110, 430]];
    const track = [];
    for (let i = 0; i < CTRL.length; i++) {
      const p0 = CTRL[(i - 1 + CTRL.length) % CTRL.length], p1 = CTRL[i], p2 = CTRL[(i + 1) % CTRL.length], p3 = CTRL[(i + 2) % CTRL.length];
      for (let s = 0; s < 22; s++) {
        const t = s / 22, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        track.push({ x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) });
      }
    }
    const N = track.length;
    track.forEach((p, i) => { const q = track[(i + 1) % N]; p.a = Math.atan2(q.y - p.y, q.x - p.x); });

    // Scenery: palms and parasols well off the track.
    const deco = [];
    for (let k = 0; deco.length < 70 && k < 2000; k++) {
      const x = W.rand(-100, 1100), y = W.rand(-50, 1000);
      if (track.every(p => Math.hypot(p.x - x, p.y - y) > TW)) deco.push({ x, y, e: W.pick(['🌴', '🌴', '🌴', '⛱️', '🦀', '🐚']) });
    }

    function nearest(car) {
      // Local search around the last known index keeps this cheap.
      let best = car.idx, bd = Infinity;
      for (let k = -12; k <= 12; k++) {
        const i = (car.idx + k + N) % N, p = track[i];
        const d = (p.x - car.x) ** 2 + (p.y - car.y) ** 2;
        if (d < bd) { bd = d; best = i; }
      }
      return [best, Math.sqrt(bd)];
    }

    const COLORS = ['#30d158', '#ff453a', '#0a84ff', '#ff9f0a', '#bf5af2'];
    const NAMES = ['You', 'Rex', 'Nova', 'Sandy', 'Blaze'];
    let cars, me, boxes, rockets, slicks, state = 'ready', countdown, raceT, steerHold = 0, finishOrder, flash = 0;

    function makeCar(i) {
      const slot = 4 - i;   // you start at the back of the grid
      const back = N - 4 - Math.floor(slot / 2) * 4, p = track[back], side = slot % 2 ? 1 : -1;
      const nx = -Math.sin(p.a), ny = Math.cos(p.a);
      return {
        x: p.x + nx * side * 16, y: p.y + ny * side * 16, a: p.a, v: 0, idx: back, laps: -1, check: true,
        color: COLORS[i], name: NAMES[i], ai: i > 0, item: null, rolling: 0, spin: 0, boost: 0, shield: 0,
        skill: 0.86 + Math.random() * 0.1, lane: W.rand(-0.5, 0.5), itemT: 0, done: false,   // skill < 1: rivals top out a bit below you
      };
    }

    function reset() {
      cars = [0, 1, 2, 3, 4].map(makeCar);
      me = cars[0];
      boxes = [];
      for (const at of [Math.floor(N * 0.15), Math.floor(N * 0.45), Math.floor(N * 0.75)]) {
        const p = track[at], nx = -Math.sin(p.a), ny = Math.cos(p.a);
        for (const o of [-22, 0, 22]) boxes.push({ x: p.x + nx * o, y: p.y + ny * o, t: 0 });
      }
      rockets = []; slicks = []; finishOrder = [];
      countdown = 3; raceT = 0;
      updateItem();
    }

    const progress = c => c.laps * N + c.idx;
    const ranked = () => [...cars].sort((a, b) => (b.done - a.done) || (a.done && b.done ? a.finishT - b.finishT : progress(b) - progress(a)));

    function giveItem(c) {
      if (c.item || c.rolling) return;
      // Cars at the back get better items (just like the real thing).
      const place = ranked().indexOf(c);
      let pool = ITEMS;
      if (place === 0) pool = ITEMS.filter(i => i.k !== 'triple' && i.k !== 'rocket');
      c.rolling = 0.8;
      c.pending = W.pick(pool);
      c.itemT = W.rand(0.8, 3);
    }

    function useItem(c) {
      if (!c.item || c.spin > 0 || state !== 'race') return;
      const it = c.item.k;
      if (it === 'boost') c.boost = 1.6;
      if (it === 'triple') c.boost = 3;
      if (it === 'shield') c.shield = 5;
      if (it === 'oil') slicks.push({ x: c.x - Math.cos(c.a) * 18, y: c.y - Math.sin(c.a) * 18, t: 12 });
      if (it === 'rocket') {
        const order = ranked(), i = order.indexOf(c);
        const target = i > 0 ? order[i - 1] : null;
        rockets.push({ x: c.x, y: c.y, a: c.a, target, t: 3.5, owner: c });
      }
      c.item = null;
      if (c === me) updateItem();
    }

    function spinOut(c) {
      if (c.shield > 0) { c.shield = 0; return; }
      c.spin = 1.3;
      if (c === me) flash = 0.3;
    }

    function updateItem() {
      if (me.rolling > 0) itemBtn.textContent = W.pick(ITEMS).e;
      else itemBtn.textContent = me.item ? me.item.e : '';
      itemBtn.classList.toggle('has', !!me.item);
    }

    function stepCar(c, dt) {
      const [idx, off] = nearest(c);
      // Lap counting with a halfway checkpoint so reversing can't cheat.
      if (idx > N * 0.45 && idx < N * 0.55) c.check = true;
      if (c.idx > N * 0.9 && idx < N * 0.1 && c.check) {
        c.laps++; c.check = false;
        if (c.laps >= LAPS && !c.done) {
          c.done = true; c.finishT = raceT; finishOrder.push(c);
          if (c === me) finish();
        }
      }
      c.idx = idx;
      const onTrack = off < TW / 2;

      if (c.rolling > 0) { c.rolling -= dt; if (c.rolling <= 0) { c.item = c.pending; if (c === me) updateItem(); } else if (c === me) updateItem(); }
      c.boost = Math.max(0, c.boost - dt);
      c.shield = Math.max(0, c.shield - dt);

      let steer = 0;
      if (c.spin > 0) {
        c.spin -= dt;
        c.v *= Math.pow(0.15, dt);
      } else if (c.ai) {
        if (c.done) { c.v *= Math.pow(0.3, dt); }
        const look = track[(idx + 7) % N], nx = -Math.sin(look.a), ny = Math.cos(look.a);
        const tx = look.x + nx * c.lane * TW * 0.35, ty = look.y + ny * c.lane * TW * 0.35;
        let d = Math.atan2(ty - c.y, tx - c.x) - c.a;
        d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
        steer = W.clamp(d * 3, -1, 1);
        if (Math.random() < dt * 0.3) c.lane = W.rand(-0.6, 0.6);
        if (c.item) { c.itemT -= dt; if (c.itemT <= 0) useItem(c); }
      } else {
        steer = steerHold;
      }
      if (c.spin <= 0) c.a += steer * 2.4 * dt * Math.min(1, c.v / 60);

      // Everyone auto-accelerates; sand slows you down; boosts go fast.
      // Gentle catch-up: rivals far ahead of you ease off, rivals far behind push a little harder.
      let band = 1;
      if (c.ai && !me.done) band = W.clamp(1 - (progress(c) - progress(me)) / N * 0.7, 0.78, 1.08);
      const top = (onTrack ? 150 : 112) * (c.ai ? c.skill * band : 1) * (c.boost > 0 ? 1.55 : 1) * (c.done && !c.ai ? 0.4 : 1);
      if (state === 'race' && c.spin <= 0) c.v += (top - c.v) * Math.min(1, dt * (c.v < top ? 1.1 : 2.5));
      c.x += Math.cos(c.a) * c.v * dt;
      c.y += Math.sin(c.a) * c.v * dt;

      for (const b of boxes) if (b.t <= 0 && Math.hypot(b.x - c.x, b.y - c.y) < 13) { b.t = 3; giveItem(c); }
      for (const s of slicks) if (s.t > 0 && Math.hypot(s.x - c.x, s.y - c.y) < 13 && c.spin <= 0) { s.t = 0; spinOut(c); }
    }

    function update(dt) {
      if (state === 'countdown') {
        countdown -= dt;
        if (countdown <= 0) state = 'race';
      }
      if (state === 'race' || state === 'finished') raceT += dt;
      for (const c of cars) stepCar(c, dt);
      // Bump cars apart.
      for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) {
        const a = cars[i], b = cars[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d < 14 && d > 0) { const push = (14 - d) / 2; a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push; }
      }
      for (const b of boxes) b.t = Math.max(0, b.t - dt);
      for (const r of rockets) {
        r.t -= dt;
        if (r.target) {
          let d = Math.atan2(r.target.y - r.y, r.target.x - r.x) - r.a;
          d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
          r.a += W.clamp(d, -4 * dt, 4 * dt);
        }
        r.x += Math.cos(r.a) * 260 * dt; r.y += Math.sin(r.a) * 260 * dt;
        for (const c of cars) if (c !== r.owner && r.t > 0 && Math.hypot(c.x - r.x, c.y - r.y) < 12) { r.t = 0; spinOut(c); }
      }
      rockets = rockets.filter(r => r.t > 0);
      for (const s of slicks) s.t -= dt;
      slicks = slicks.filter(s => s.t > 0);

      const place = ranked().indexOf(me) + 1;
      posEl.innerHTML = `${place}<small>${['st', 'nd', 'rd'][place - 1] || 'th'}</small>`;
      hud.innerHTML = `Lap ${Math.min(LAPS, Math.max(1, me.laps + 1))}/${LAPS}<small>${raceT.toFixed(1)}s</small>`;
    }

    function finish() {
      state = 'finished';
      const place = finishOrder.indexOf(me) + 1;
      const best = W.best('buggy', place, true);
      setTimeout(() => W.overlay({
        title: place === 1 ? '🏆 You win!' : place <= 3 ? `🏁 ${place}${['st', 'nd', 'rd'][place - 1]} place!` : `🏁 ${place}th place`,
        big: raceT.toFixed(1) + 's',
        text: `Best finish: ${best}${['st', 'nd', 'rd'][best - 1] || 'th'}`,
        button: 'Race again', onStart: start,
      }), 900);
    }

    // ---- First-person 3D renderer: projects the 2D world from the driver's seat ----
    // Edge points for road and curbs, precomputed per track sample.
    track.forEach(p => {
      const nx = -Math.sin(p.a), ny = Math.cos(p.a);
      p.l = [p.x - nx * TW / 2, p.y - ny * TW / 2]; p.r = [p.x + nx * TW / 2, p.y + ny * TW / 2];
      p.lo = [p.x - nx * (TW / 2 + 7), p.y - ny * (TW / 2 + 7)]; p.ro = [p.x + nx * (TW / 2 + 7), p.y + ny * (TW / 2 + 7)];
      p.cl = [p.x - nx * 1.2, p.y - ny * 1.2]; p.cr = [p.x + nx * 1.2, p.y + ny * 1.2];
    });
    const NEAR = 3, EYE = 6.5, DRAW = 75;   // near plane, eye height, segments drawn ahead
    let C, F, HOR, steerVis = 0, lastA = 0;

    function setCam() {
      C = { x: me.x - Math.cos(me.a) * 3, y: me.y - Math.sin(me.a) * 3, ca: Math.cos(me.a), sa: Math.sin(me.a) };
      F = view.w * (me.boost > 0 ? 0.62 : 0.72);   // FOV widens when boosting
      HOR = view.h * 0.42;
    }
    const toCam = (x, y) => { const dx = x - C.x, dy = y - C.y; return { f: dx * C.ca + dy * C.sa, r: -dx * C.sa + dy * C.ca }; };
    const proj = (q, z = 0) => [view.w / 2 + q.r / q.f * F, HOR + (EYE - z) / q.f * F];

    // Fill a ground polygon (world coords), clipped against the near plane.
    function ground(pts, color) {
      const cam = pts.map(([x, y]) => toCam(x, y)), out = [];
      for (let i = 0; i < cam.length; i++) {
        const a = cam[i], b = cam[(i + 1) % cam.length];
        if (a.f >= NEAR) out.push(a);
        if ((a.f >= NEAR) !== (b.f >= NEAR)) { const t = (NEAR - a.f) / (b.f - a.f); out.push({ f: NEAR, r: a.r + (b.r - a.r) * t }); }
      }
      if (out.length < 3) return;
      ctx.fillStyle = color;
      ctx.beginPath();
      out.forEach((q, i) => { const [sx, sy] = proj(q); ctx[i ? 'lineTo' : 'moveTo'](sx, sy); });
      ctx.closePath(); ctx.fill();
    }

    // Blend a colour toward the hazy horizon with distance.
    function fog(hex, t) {
      const n = parseInt(hex.slice(1), 16), k = Math.min(1, t) * 0.75;
      const mix = (c, h) => Math.round(c + (h - c) * k);
      return `rgb(${mix(n >> 16, 225)},${mix((n >> 8) & 255, 238)},${mix(n & 255, 245)})`;
    }

    function carSprite(c, s, x, y) {
      // Seen from behind: shadow, tyres, body, rear window, lights.
      const w = 17 * s, h = 7 * s;
      ctx.save(); ctx.translate(x, y);
      if (c.spin > 0) ctx.rotate(Math.sin(c.spin * 20) * 0.4);
      ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(0, 0, w * 0.65, h * 0.35, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillRect(-w / 2, -h * 0.9, w * 0.22, h * 0.9); ctx.fillRect(w / 2 - w * 0.22, -h * 0.9, w * 0.22, h * 0.9);
      ctx.fillStyle = c.color; ctx.fillRect(-w * 0.4, -h * 1.6, w * 0.8, h * 1.1);
      ctx.fillStyle = '#ffffff55'; ctx.fillRect(-w * 0.4, -h * 1.6, w * 0.8, h * 0.18);
      ctx.fillStyle = '#1c1c1e'; ctx.fillRect(-w * 0.26, -h * 2.25, w * 0.52, h * 0.7);
      ctx.fillStyle = '#9fd8ff'; ctx.fillRect(-w * 0.22, -h * 2.15, w * 0.44, h * 0.45);
      ctx.fillStyle = '#ff3b30'; ctx.fillRect(-w * 0.38, -h * 1.15, w * 0.12, h * 0.25); ctx.fillRect(w * 0.26, -h * 1.15, w * 0.12, h * 0.25);
      if (c.boost > 0) { ctx.fillStyle = Math.random() < 0.5 ? '#ff9f0a' : '#ffd60a'; ctx.beginPath(); ctx.arc(0, -h * 0.7, h * (0.4 + Math.random() * 0.3), 0, TAU); ctx.fill(); }
      if (c.shield > 0) { ctx.strokeStyle = '#64d2ffcc'; ctx.lineWidth = Math.max(1, s); ctx.beginPath(); ctx.ellipse(0, -h, w * 0.7, h * 1.5, 0, 0, TAU); ctx.stroke(); }
      ctx.restore();
    }

    function render(dt) {
      const { w, h } = view;
      setCam();
      // Sky, sun, clouds that slide as you turn, the sea and distant islands.
      const sky = ctx.createLinearGradient(0, 0, 0, HOR);
      sky.addColorStop(0, '#1e7fd8'); sky.addColorStop(1, '#bfe6ff');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, w, HOR + 1);
      const turn = ((me.a % TAU) + TAU) % TAU;
      const sunX = ((0.3 - turn / TAU) * w * 4 % (w * 4) + w * 4) % (w * 4) - w;
      ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(sunX, HOR * 0.35, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff6c255'; ctx.beginPath(); ctx.arc(sunX, HOR * 0.35, 20, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffffd0';
      for (let k = 0; k < 6; k++) {
        const x = ((k * 97 - turn / TAU * w * 3) % (w * 1.6) + w * 1.6) % (w * 1.6) - w * 0.3, y = HOR * (0.2 + (k % 3) * 0.18);
        ctx.beginPath(); ctx.ellipse(x, y, 16, 5, 0, 0, TAU); ctx.ellipse(x + 10, y - 3, 10, 5, 0, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#2f8fd6'; ctx.fillRect(0, HOR - 4, w, 5);
      ctx.fillStyle = '#6aa37a';
      for (let k = 0; k < 4; k++) {
        const x = ((k * 150 - turn / TAU * w * 2) % (w * 2) + w * 2) % (w * 2) - w * 0.4;
        ctx.beginPath(); ctx.ellipse(x, HOR - 3, 30, 7, 0, Math.PI, 0); ctx.fill();
      }
      // Sand, lighter toward the horizon.
      const sand = ctx.createLinearGradient(0, HOR, 0, h);
      sand.addColorStop(0, '#f3e4bf'); sand.addColorStop(1, '#d9b877');
      ctx.fillStyle = sand; ctx.fillRect(0, HOR, w, h - HOR);

      // Road: far to near so near segments paint over far ones.
      for (let k = DRAW; k >= -3; k--) {
        const i = (me.idx + k + N) % N, p = track[i], q = track[(i + 1) % N], t = Math.max(0, k) / DRAW;
        ground([p.lo, q.lo, q.ro, p.ro], fog(i % 2 ? '#ff3b30' : '#ffffff', t));
        ground([p.l, q.l, q.r, p.r], fog(Math.floor(i / 2) % 2 ? '#6b6b70' : '#737378', t));
        if (Math.floor(i / 3) % 2) ground([p.cl, q.cl, q.cr, p.cr], fog('#f2f2f7', t));
        if (i === 0) {   // chequered finish line
          const m = track[1];
          for (let s = 0; s < 8; s++) {
            const a0 = s / 8, a1 = (s + 1) / 8, L = (u, v) => [p.l[0] + (p.r[0] - p.l[0]) * u + (m.l[0] - p.l[0]) * v * 0.5, p.l[1] + (p.r[1] - p.l[1]) * u + (m.l[1] - p.l[1]) * v * 0.5];
            ground([L(a0, 0), L(a1, 0), L(a1, 1), L(a0, 1)], s % 2 ? '#111' : '#fff');
          }
        }
      }
      for (const s of slicks) { const n = 8, pts = []; for (let k = 0; k < n; k++) pts.push([s.x + Math.cos(k / n * TAU) * 10, s.y + Math.sin(k / n * TAU) * 7]); ground(pts, '#111c'); }

      // Sprites: rivals, item boxes, rockets and scenery, painted far to near.
      const sprites = [];
      const add = (x, y, fn) => { const q = toCam(x, y); if (q.f > NEAR + 1 && q.f < 900 && Math.abs(q.r / q.f) < 1.4) sprites.push({ q, fn }); };
      for (const c of cars) if (c !== me) add(c.x, c.y, (q, s, [x, y]) => carSprite(c, s, x, y));
      const tm = performance.now() / 1000;
      for (const b of boxes) if (b.t <= 0) add(b.x, b.y, (q, s, [x, y]) => {
        const sz = 11 * s, yy = y - sz * (1.1 + Math.sin(tm * 3 + b.x) * 0.15);
        ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(x, y, sz * 0.5, sz * 0.15, 0, 0, TAU); ctx.fill();
        ctx.save(); ctx.translate(x, yy); ctx.scale(Math.cos(tm * 2) * 0.35 + 0.75, 1);
        const g = ctx.createLinearGradient(-sz / 2, -sz / 2, sz / 2, sz / 2);
        g.addColorStop(0, '#ffe066'); g.addColorStop(0.5, '#ff9f0a'); g.addColorStop(1, '#bf5af2');
        ctx.fillStyle = g; ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
        ctx.strokeStyle = '#fff8'; ctx.lineWidth = Math.max(1, sz * 0.06); ctx.strokeRect(-sz / 2, -sz / 2, sz, sz);
        ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(sz * 0.75)}px -apple-system, system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, sz * 0.04);
        ctx.restore();
      });
      for (const r of rockets) add(r.x, r.y, (q, s, [x, y]) => { ctx.font = `${Math.round(12 * s)}px sans-serif`; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.fillText('🚀', x, y - 6 * s); });
      for (const d of deco) add(d.x, d.y, (q, s, [x, y]) => {
        const size = (d.e === '🌴' ? 34 : d.e === '⛱️' ? 20 : 9) * s;
        if (size < 2) return;
        ctx.font = `${Math.round(size)}px sans-serif`; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.globalAlpha = Math.max(0.35, 1 - q.f / 900); ctx.fillText(d.e, x, y + size * 0.1); ctx.globalAlpha = 1;
      });
      sprites.sort((a, b) => b.q.f - a.q.f);
      for (const sp of sprites) sp.fn(sp.q, F / sp.q.f, proj(sp.q));

      // Cockpit: your hood and a steering wheel that turns with you.
      const da = ((me.a - lastA + Math.PI) % TAU + TAU) % TAU - Math.PI;
      lastA = me.a;
      steerVis += (W.clamp(da / Math.max(dt, 0.001) * 0.5, -1.2, 1.2) - steerVis) * Math.min(1, dt * 10);
      const hood = ctx.createLinearGradient(0, h * 0.82, 0, h);
      hood.addColorStop(0, '#5ee07e'); hood.addColorStop(1, '#1f8a3a');
      ctx.fillStyle = hood;
      ctx.beginPath(); ctx.moveTo(-5, h); ctx.quadraticCurveTo(w * 0.1, h * 0.86, w * 0.3, h * 0.84); ctx.lineTo(w * 0.7, h * 0.84); ctx.quadraticCurveTo(w * 0.9, h * 0.86, w + 5, h); ctx.fill();
      ctx.fillStyle = '#ffffff40'; ctx.fillRect(w * 0.3, h * 0.84, w * 0.4, 2);
      ctx.save(); ctx.translate(w / 2, h * 1.02); ctx.rotate(steerVis);
      ctx.strokeStyle = '#1c1c1e'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, w * 0.2, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.strokeStyle = '#3a3a3c'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -w * 0.2); ctx.stroke();
      ctx.fillStyle = '#ff9f0a'; ctx.fillRect(-2, -w * 0.2 - 4, 4, 4);
      ctx.restore();
      if (me.boost > 0) {   // speed lines
        ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 1.5;
        for (let k = 0; k < 8; k++) { const a = Math.random() * TAU, r0 = w * 0.35; ctx.beginPath(); ctx.moveTo(w / 2 + Math.cos(a) * r0, HOR + Math.sin(a) * r0); ctx.lineTo(w / 2 + Math.cos(a) * r0 * 1.6, HOR + Math.sin(a) * r0 * 1.6); ctx.stroke(); }
      }
      if (me.shield > 0) { ctx.strokeStyle = '#64d2ff88'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, w - 6, h - 6); }
      if (me.spin > 0) { ctx.fillStyle = `rgba(255,255,255,${me.spin * 0.25})`; ctx.fillRect(0, 0, w, h); }

      // Minimap.
      const mm = 40, mx = 6, my = h * 0.62;
      ctx.fillStyle = '#0005'; ctx.fillRect(mx, my, mm, mm);
      ctx.strokeStyle = '#fff8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); track.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](mx + 3 + p.x / 1000 * (mm - 6), my + 3 + p.y / 900 * (mm - 6))); ctx.closePath(); ctx.stroke();
      for (const c of cars) { ctx.fillStyle = c.color; ctx.fillRect(mx + 3 + c.x / 1000 * (mm - 6) - 2, my + 3 + c.y / 900 * (mm - 6) - 2, 4, 4); }

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (state === 'countdown') {
        ctx.fillStyle = '#fff'; ctx.font = '900 48px -apple-system, system-ui';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        const n = Math.ceil(countdown);
        ctx.strokeText(n, w / 2, h * 0.4); ctx.fillText(n, w / 2, h * 0.4);
      } else if (raceT < 1 && state === 'race') {
        ctx.fillStyle = '#30d158'; ctx.font = '900 34px -apple-system, system-ui';
        ctx.fillText('GO!', w / 2, h * 0.4);
      }
      if (flash > 0) { flash -= dt; ctx.fillStyle = `rgba(255,69,58,${flash})`; ctx.fillRect(0, 0, w, h); }
    }

    // ---- Controls: Digital Crown steers. Touch: hold left/right side to steer, tap the middle or the item box to use items.
    W.crown(d => { if (state === 'race' && me.spin <= 0) me.a += d * 0.009; });
    W.pointer(canvas, {
      down(p) { if (p.x < view.w * 0.33) steerHold = -1; else if (p.x > view.w * 0.67) steerHold = 1; else useItem(me); },
      move(p) { if (steerHold) steerHold = p.x < view.w / 2 ? -1 : 1; },
      up() { steerHold = 0; },
    });
    const fireItem = e => { e.preventDefault(); e.stopPropagation(); useItem(me); };
    itemBtn.addEventListener('touchstart', fireItem, { passive: false });
    itemBtn.addEventListener('mousedown', fireItem);
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') steerHold = -1;
      if (e.key === 'ArrowRight') steerHold = 1;
      if (e.key === ' ') useItem(me);
    });
    window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') steerHold = 0; });

    function start() { reset(); state = 'countdown'; }
    reset();
    W.overlay({
      title: '🏖️ Beach Buggy',
      text: 'Turn the Crown to steer<br>(or hold left/right). Hit ❓<br>boxes, tap the middle or<br>the item box to use it!',
      button: 'Race!', onStart: start,
    });
    W.loop(dt => { if (state !== 'ready') update(dt); render(dt); });
  </script>
</body>
</html>
