<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Dice Poker</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>
    body.game { background: #3b0d0d; }
    #area { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 30px 5px max(5px, env(safe-area-inset-bottom)); gap: 6px; }
    #dice { display: flex; gap: 4px; justify-content: center; }
    .die { width: 18%; aspect-ratio: 1; border: 0; border-radius: 9px; background: #fff; color: #000; font-size: 28px; line-height: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .die.held { background: #ffd60a; transform: translateY(-4px); }
    .die.held::after { content: 'HOLD'; position: absolute; bottom: -12px; font-size: 7px; font-weight: 800; color: #ffd60a; }
    .die.roll { animation: roll 0.3s; }
    @keyframes roll { 50% { transform: rotate(180deg) scale(0.8); } }
    #hand { text-align: center; font-size: 15px; font-weight: 800; min-height: 20px; margin-top: 6px; }
    #info { text-align: center; font-size: 10px; color: #ffb3b3; min-height: 13px; }
    #roll { border: 0; border-radius: 20px; background: #ffd60a; color: #000; font: inherit; font-size: 15px; font-weight: 800; padding: 9px; }
  </style>
</head>
<body class="game">
  <div id="area">
    <div id="dice"></div>
    <div id="hand"></div>
    <div id="info"></div>
    <button id="roll">Roll</button>
  </div>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    // 10 hands. Each hand: roll, tap dice to hold, re-roll up to twice. Score the best poker hand.
    const FACES = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    const HANDS = [['Five of a kind!', 50], ['Four of a kind', 25], ['Full house', 15], ['Straight', 12], ['Three of a kind', 8], ['Two pair', 5], ['Pair', 2], ['Nothing', 0]];
    const $ = id => document.getElementById(id);
    let dice, held, rolls, handNo, total;

    function evaluate(d) {
      const c = {}; d.forEach(v => (c[v] = (c[v] || 0) + 1));
      const n = Object.values(c).sort((a, b) => b - a), s = [...new Set(d)].sort().join('');
      if (n[0] === 5) return 0;
      if (n[0] === 4) return 1;
      if (n[0] === 3 && n[1] === 2) return 2;
      if (s === '12345' || s === '23456') return 3;
      if (n[0] === 3) return 4;
      if (n[0] === 2 && n[1] === 2) return 5;
      if (n[0] === 2) return 6;
      return 7;
    }

    function draw(animate = []) {
      $('dice').innerHTML = '';
      dice.forEach((v, i) => {
        const b = document.createElement('button');
        b.className = 'die' + (held[i] ? ' held' : '') + (animate.includes(i) ? ' roll' : '');
        b.textContent = v ? FACES[v] : '?';
        b.addEventListener('click', () => { if (rolls > 0 && rolls < 3) { held[i] = !held[i]; draw(); } });
        $('dice').appendChild(b);
      });
      const h = dice[0] ? HANDS[evaluate(dice)] : null;
      $('hand').textContent = h ? `${h[0]} · ${h[1]}` : '';
      $('info').textContent = rolls === 0 ? `Hand ${handNo}/10 — roll!` : rolls < 3 ? `Tap dice to hold · ${3 - rolls} re-roll${3 - rolls > 1 ? 's' : ''} left` : '';
      $('roll').textContent = rolls === 0 ? 'Roll' : rolls < 3 ? 'Re-roll' : handNo < 10 ? 'Score & next hand' : 'Finish';
      $('hud').innerHTML = `${total}<small>hand ${handNo}/10</small>`;
    }

    $('roll').addEventListener('click', () => {
      if (rolls < 3 && !(rolls > 0 && held.every(Boolean))) {
        const changed = [];
        dice = dice.map((v, i) => (held[i] && rolls > 0 ? v : (changed.push(i), W.randInt(1, 6))));
        rolls++;
        draw(changed);
        return;
      }
      total += HANDS[evaluate(dice)][1];
      if (handNo >= 10) {
        draw();
        const best = W.best('dicepoker', total);
        W.overlay({ title: 'Game over 🎲', big: total, text: `Best ${best}`, button: 'Again', onStart: start });
        return;
      }
      handNo++; rolls = 0; dice = [0, 0, 0, 0, 0]; held = [false, false, false, false, false];
      draw();
    });

    function start() { total = 0; handNo = 1; rolls = 0; dice = [0, 0, 0, 0, 0]; held = [false, false, false, false, false]; draw(); }
    start();
  </script>
</body>
</html>
