<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Wall Jump</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    // A ninja runs up the wall. Tap to leap to the other wall and dodge the spikes.
    let side, jumpT, height, spikes, speed, state = 'ready', stars = [];
    const WALL = 14, NY = () => view.h * 0.7, JUMP = 0.28;
    function reset() { side = -1; jumpT = 0; height = 0; speed = view.h * 0.55; spikes = []; let y = view.h * 0.8; for (let k = 0; k < 8; k++) { y += view.h * W.rand(0.25, 0.4); spikes.push({ h: y, side: W.rng() < 0.5 ? -1 : 1, len: view.h * W.rand(0.08, 0.14) }); } hud.textContent = '0'; }
    function jump() { if (state === 'play' && jumpT <= 0) { side = -side; jumpT = JUMP; } }
    const nx = () => { const L = WALL + 8, R = view.w - WALL - 8; const t = jumpT > 0 ? 1 - jumpT / JUMP : 1; const from = side < 0 ? R : L, to = side < 0 ? L : R; return from + (to - from) * t; };
    function update(dt) {
      speed += view.h * 0.01 * dt;
      height += speed * dt;
      jumpT = Math.max(0, jumpT - dt);
      hud.textContent = Math.floor(height / 10);
      if (jumpT <= 0) for (const s of spikes) {
        const sy = NY() - (s.h - height);
        if (s.side === side && sy > NY() - s.len && sy - 0 < NY() + 8 && Math.abs(sy - NY()) < s.len) { state = 'over'; const sc = Math.floor(height / 10), best = W.best('walljump', sc); setTimeout(() => W.overlay({ title: 'Spiked!', big: sc, text: `Best ${best}`, button: 'Again', onStart: start }), 400); return; }
      }
      spikes = spikes.filter(s => s.h - height > -view.h * 0.5);
      while (spikes.length < 8) { const last = spikes[spikes.length - 1]; spikes.push({ h: last.h + view.h * W.rand(0.22, 0.38) * Math.max(0.7, 1 - height / 30000), side: W.rng() < 0.5 ? -1 : 1, len: view.h * W.rand(0.08, 0.16) }); }
    }
    function render() {
      const { w, h } = view;
      ctx.fillStyle = '#16213e'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff22';
      for (let k = 0; k < 20; k++) ctx.fillRect((k * 37) % w, ((k * 53 + height * 0.2) % h), 1.5, 1.5);
      for (const x of [0, w - WALL]) {
        ctx.fillStyle = '#4a3f6b'; ctx.fillRect(x, 0, WALL, h);
        ctx.fillStyle = '#5c5185';
        for (let y = -((height) % 20); y < h; y += 20) ctx.fillRect(x, y, WALL, 2);
      }
      for (const s of spikes) {
        const y = NY() - (s.h - height), x0 = s.side < 0 ? WALL : w - WALL, dir = s.side < 0 ? 1 : -1;
        ctx.fillStyle = '#e5e5ea';
        for (let k = 0; k < s.len; k += 8) { ctx.beginPath(); ctx.moveTo(x0, y - k); ctx.lineTo(x0 + dir * 9, y - k - 4); ctx.lineTo(x0, y - k - 8); ctx.fill(); }
      }
      ctx.save(); ctx.translate(nx(), NY());
      if (side > 0 && jumpT <= 0) ctx.scale(-1, 1);
      ctx.rotate(jumpT > 0 ? (1 - jumpT / JUMP) * Math.PI * 2 * -side : 0);
      ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
      ctx.fillText(state === 'over' ? '😵' : '🥷', 0, 0);
      ctx.restore();
    }
    W.pointer(canvas, { down: jump });
    window.addEventListener('keydown', e => { if (e.key === ' ') jump(); });
    function start() { reset(); state = 'play'; }
    reset();
    W.overlay({ title: '🥷 Wall Jump', text: 'Tap to leap between walls.<br>Dodge the spikes as you<br>climb faster and faster!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(); });
  </script>
</body>
</html>
