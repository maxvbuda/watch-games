<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Flood It</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>
    #area { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 28px 4px max(4px, env(safe-area-inset-bottom)); gap: 5px; }
    #grid { --size: min(96vw, calc(100vh - 70px)); width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(10, 1fr); border-radius: 6px; overflow: hidden; }
    #grid div { transition: background 0.2s; }
    #pal { display: flex; gap: 4px; width: min(96vw, 260px); }
    #pal button { flex: 1; height: 30px; border: 0; border-radius: 15px; }
    #pal button:disabled { opacity: 0.25; }
  </style>
</head>
<body class="game">
  <div id="area"><div id="grid"></div><div id="pal"></div></div>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const N = 10, COLORS = ['#ff453a', '#ffd60a', '#30d158', '#0a84ff', '#bf5af2', '#ff9f0a'];
    const LIMIT = 22;
    const $ = id => document.getElementById(id);
    let cells, moves, done;
    const els = [];

    for (let i = 0; i < N * N; i++) { const d = document.createElement('div'); $('grid').appendChild(d); els.push(d); }
    COLORS.forEach((c, i) => {
      const b = document.createElement('button');
      b.style.background = c;
      b.addEventListener('click', () => pick(i));
      $('pal').appendChild(b);
    });

    // The flooded region: everything connected to the top-left corner with its colour.
    function region() {
      const c = cells[0], seen = new Set([0]), stack = [0];
      while (stack.length) {
        const i = stack.pop(), x = i % N, y = Math.floor(i / N);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy, j = ny * N + nx;
          if (nx >= 0 && ny >= 0 && nx < N && ny < N && !seen.has(j) && cells[j] === c) { seen.add(j); stack.push(j); }
        }
      }
      return seen;
    }

    function pick(c) {
      if (done || c === cells[0]) return;
      for (const i of region()) cells[i] = c;
      moves++;
      draw();
      const all = region().size === N * N;
      if (all || moves >= LIMIT) {
        done = true;
        if (all) W.best('flood', moves, true);
        setTimeout(() => W.overlay({ title: all ? 'Flooded! 🌊' : 'Out of moves', big: all ? moves + ' moves' : `${region().size}%`, text: all ? `Limit was ${LIMIT}` : 'of the board covered', button: 'New board', onStart: start }), 400);
      }
    }

    function draw() {
      cells.forEach((c, i) => (els[i].style.background = COLORS[c]));
      [...$('pal').children].forEach((b, i) => (b.disabled = i === cells[0]));
      $('hud').innerHTML = `${moves}/${LIMIT}<small>moves</small>`;
    }

    function start() { cells = Array.from({ length: N * N }, () => W.randInt(0, COLORS.length - 1)); moves = 0; done = false; draw(); }
    start();
    W.overlay({ title: '🌊 Flood It', text: `Pick colours to flood the<br>board from the top-left.<br>Fill it in ${LIMIT} moves!`, onStart() {} });
  </script>
</body>
</html>
