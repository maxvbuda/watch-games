<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Magic 8 Ball</title>
  <link rel="stylesheet" href="../css/watch.css">
  <style>
    #area { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding-top: 16px; }
    #ball {
      --s: min(82vw, calc(100vh - 60px));
      width: var(--s); height: var(--s); border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #555 0%, #111 45%, #000 70%);
      display: flex; align-items: center; justify-content: center;
    }
    #ball.shake { animation: shake 0.6s; }
    @keyframes shake {
      20% { transform: translate(-6px, 3px) rotate(-6deg); } 40% { transform: translate(6px, -3px) rotate(6deg); }
      60% { transform: translate(-4px, 2px) rotate(-3deg); } 80% { transform: translate(3px, -1px) rotate(2deg); }
    }
    #window {
      width: 52%; height: 52%; border-radius: 50%; background: radial-gradient(circle, #0a1a6a, #020824);
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    #answer {
      width: 78%; font-size: calc(var(--s) / 14); font-weight: 700; color: #64d2ff; line-height: 1.15;
      transition: opacity 0.4s;
    }
    #hint { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body class="game">
  <div id="area">
    <div id="ball"><div id="window"><div id="answer">8</div></div></div>
    <div id="hint">Ask a question, then tap</div>
  </div>
  <script src="../js/common.js"></script>
  <script>
    const ANSWERS = [
      'It is certain', 'Without a doubt', 'Yes, definitely', 'You may rely on it', 'As I see it, yes',
      'Most likely', 'Outlook good', 'Yes', 'Signs point to yes', 'Reply hazy, try again',
      'Ask again later', 'Better not tell you now', 'Cannot predict now', 'Concentrate and ask again',
      "Don't count on it", 'My reply is no', 'My sources say no', 'Outlook not so good', 'Very doubtful',
    ];
    const ball = document.getElementById('ball');
    const answer = document.getElementById('answer');
    let busy = false;

    function shake() {
      if (busy) return;
      busy = true;
      answer.style.opacity = 0;
      ball.classList.remove('shake');
      void ball.offsetWidth;
      ball.classList.add('shake');
      setTimeout(() => {
        answer.textContent = W.pick(ANSWERS);
        answer.style.fontSize = '';
        answer.style.opacity = 1;
        busy = false;
      }, 700);
    }

    const area = document.getElementById('area');
    area.addEventListener('touchstart', e => { e.preventDefault(); shake(); }, { passive: false });
    area.addEventListener('mousedown', shake);
    // Turning the crown shakes it too.
    let acc = 0;
    W.crown(d => { acc += Math.abs(d); if (acc > 80) { acc = 0; shake(); } });
  </script>
</body>
</html>
