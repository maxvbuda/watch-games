<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Keepy Uppy</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    // Tap the ball to kick it up. Where you hit it sets the direction. Don't let it touch the ground!
    let b, kicks, state = 'ready', puffs = [];
    const R = () => view.w * 0.1;
    function reset() { b = { x: view.w / 2, y: view.h * 0.3, vx: 0, vy: 0, rot: 0, vr: 0 }; kicks = 0; hud.textContent = '0'; }
    function kick(p) {
      if (state !== 'play') return;
      const dx = p.x - b.x, dy = p.y - b.y;
      if (Math.hypot(dx, dy) > R() * 1.6) return;
      b.vy = -view.h * (1.15 + Math.min(kicks, 40) * 0.006);
      b.vx = -dx * 5 + W.rand(-20, 20);
      b.vr = -dx * 0.3;
      kicks++; hud.textContent = kicks;
      puffs.push({ x: b.x, y: b.y + R(), t: 0.3 });
    }
    function update(dt) {
      b.vy += view.h * (1.6 + Math.min(kicks, 40) * 0.02) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (b.x < R()) { b.x = R(); b.vx = Math.abs(b.vx); }
      if (b.x > view.w - R()) { b.x = view.w - R(); b.vx = -Math.abs(b.vx); }
      if (b.y > view.h - R() - 8) {
        state = 'over';
        const best = W.best('keepyuppy', kicks);
        setTimeout(() => W.overlay({ title: 'Dropped it!', big: kicks, text: `kicks · best ${best}`, button: 'Again', onStart: start }), 400);
      }
    }
    function render(dt) {
      const { w, h } = view;
      ctx.fillStyle = '#87ceeb'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#4caf50'; ctx.fillRect(0, h - 10, w, 10);
      ctx.fillStyle = '#0002'; ctx.beginPath(); ctx.ellipse(b.x, h - 10, R() * (0.5 + b.y / h * 0.5), 3, 0, 0, Math.PI * 2); ctx.fill();
      for (const p of puffs) { p.t -= dt; ctx.fillStyle = `rgba(255,255,255,${Math.max(0, p.t * 3)})`; ctx.beginPath(); ctx.arc(p.x, p.y, (0.3 - p.t) * 60, 0, Math.PI * 2); ctx.fill(); }
      puffs = puffs.filter(p => p.t > 0);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.font = `${Math.round(R() * 2)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText('⚽️', 0, 0);
      ctx.restore();
    }
    W.pointer(canvas, { down: kick });
    function start() { reset(); state = 'play'; }
    reset();
    W.overlay({ title: '⚽️ Keepy Uppy', text: 'Tap the ball to kick it up.<br>Tap its side to send it the<br>other way. Never drop it!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
