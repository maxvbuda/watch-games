<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Cave Flyer</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;

    const SEG = 6;   // px per cave column
    let cols, blocks, heli, holding = false, dist, speed, state = 'ready', trail, pathY, pathV, gap;

    function nextCol() {
      // The cave centre wanders smoothly; the gap shrinks with distance.
      pathV += W.rand(-0.6, 0.6);
      pathV = W.clamp(pathV, -2.2, 2.2);
      pathY += pathV;
      gap = Math.max(view.h * 0.42, view.h * 0.78 - dist * 0.08);
      pathY = W.clamp(pathY, gap / 2 + 4, view.h - gap / 2 - 4);
      if (pathY === gap / 2 + 4 || pathY === view.h - gap / 2 - 4) pathV *= -0.5;
      return { top: pathY - gap / 2, bot: pathY + gap / 2 };
    }

    function reset() {
      dist = 0; speed = view.w * 0.55;
      pathY = view.h / 2; pathV = 0; gap = view.h * 0.78;
      cols = [];
      for (let x = 0; x <= view.w + SEG; x += SEG) cols.push({ top: view.h * 0.11, bot: view.h * 0.89 });
      blocks = [];
      trail = [];
      heli = { x: view.w * 0.25, y: view.h / 2, vy: 0 };
      hud.textContent = '0';
    }

    let offset = 0, blockT = 2;
    function update(dt) {
      speed += view.w * 0.01 * dt;
      dist += speed * dt / 10;
      hud.textContent = Math.floor(dist);
      heli.vy += (holding ? -view.h * 2.4 : view.h * 2.2) * dt;
      heli.vy = W.clamp(heli.vy, -view.h * 0.9, view.h * 0.9);
      heli.y += heli.vy * dt;

      offset += speed * dt;
      while (offset >= SEG) { offset -= SEG; cols.shift(); cols.push(nextCol()); }
      for (const b of blocks) b.x -= speed * dt;
      blocks = blocks.filter(b => b.x > -20);
      blockT -= dt;
      if (blockT <= 0) {
        const c = cols[cols.length - 1];
        const bh = (c.bot - c.top) * 0.28;
        blocks.push({ x: view.w + 10, y: W.rand(c.top + 4, c.bot - bh - 4), w: 10, h: bh });
        blockT = W.rand(1.4, 2.4);
      }

      trail.push({ x: heli.x, y: heli.y });
      if (trail.length > 20) trail.shift();
      for (const p of trail) p.x -= speed * dt;

      const r = 5;
      const c = cols[Math.floor((heli.x + offset) / SEG)];
      const hitWall = heli.y - r < c.top || heli.y + r > c.bot;
      const hitBlock = blocks.some(b => heli.x + r > b.x && heli.x - r < b.x + b.w && heli.y + r > b.y && heli.y - r < b.y + b.h);
      if (hitWall || hitBlock) {
        state = 'over';
        const s = Math.floor(dist);
        const best = W.best('cave', s);
        setTimeout(() => W.overlay({ title: 'Crashed!', big: s, text: `Best ${best}`, button: 'Again', onStart: start }), 500);
      }
    }

    function render() {
      const { w, h } = view;
      ctx.fillStyle = '#0a1f10';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#30d158';
      ctx.beginPath();
      ctx.moveTo(-offset, 0);
      cols.forEach((c, i) => ctx.lineTo(i * SEG - offset, c.top));
      ctx.lineTo(w + SEG, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-offset, h);
      cols.forEach((c, i) => ctx.lineTo(i * SEG - offset, c.bot));
      ctx.lineTo(w + SEG, h);
      ctx.fill();
      ctx.fillStyle = '#248a3d';
      for (const b of blocks) ctx.fillRect(b.x, b.y, b.w, b.h);

      trail.forEach((p, i) => {
        ctx.fillStyle = `rgba(255,255,255,${i / trail.length * 0.4})`;
        ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      });
      if (state !== 'over') {
        ctx.fillStyle = '#ffd60a';
        ctx.beginPath(); ctx.arc(heli.x, heli.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(heli.x + 2.5, heli.y - 1.5, 1.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('💥', heli.x, heli.y);
      }
      if (state === 'play' && dist < 3) {
        ctx.fillStyle = '#fff'; ctx.font = '600 12px -apple-system, system-ui'; ctx.textAlign = 'center';
        ctx.fillText('Hold to rise', w / 2, h * 0.3);
      }
    }

    W.pointer(canvas, { down() { holding = true; }, up() { holding = false; } });
    window.addEventListener('keydown', e => { if (e.key === ' ') holding = true; });
    window.addEventListener('keyup', e => { if (e.key === ' ') holding = false; });

    function start() { reset(); offset = 0; blockT = 2; holding = false; state = 'play'; }
    reset();
    W.overlay({ title: '🦇 Cave Flyer', text: 'Hold to fly up,<br>let go to drop.<br>Don\'t touch the walls!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(); });
  </script>
</body>
</html>
