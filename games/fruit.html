<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <title>Fruit Slice</title>
  <link rel="stylesheet" href="../css/watch.css">
</head>
<body class="game">
  <canvas id="c" class="full"></canvas>
  <div class="hud" id="hud"></div>
  <script src="../js/common.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const view = W.setupCanvas(canvas);
    const ctx = view.ctx;
    const FRUITS = ['🍉', '🍊', '🍎', '🍋', '🍍', '🥝', '🍑', '🍇', '🍓', '🥥'];

    let items, halves, trail, score, misses, spawnT, elapsed, state = 'ready', splats, flash = 0;
    const FS = () => view.w * 0.16;

    function reset() {
      items = []; halves = []; trail = []; splats = [];
      score = 0; misses = 0; spawnT = 0.5; elapsed = 0;
      updateHud();
    }
    function updateHud() { hud.innerHTML = `${score}<small>${'✕'.repeat(misses)}${'·'.repeat(3 - misses)}</small>`; }

    function toss() {
      const n = Math.random() < Math.min(0.5, elapsed / 60) ? W.randInt(2, 3) : 1;
      for (let i = 0; i < n; i++) {
        const bomb = Math.random() < Math.min(0.22, 0.08 + elapsed / 300);
        const x = W.rand(view.w * 0.2, view.w * 0.8);
        items.push({
          x, y: view.h + 20,
          vx: (view.w / 2 - x) * W.rand(0.3, 0.9),
          vy: -view.h * W.rand(1.35, 1.6),
          rot: 0, vr: W.rand(-4, 4),
          e: bomb ? '💣' : W.pick(FRUITS),
          bomb,
        });
      }
    }

    // Distance from point p to segment ab.
    function segDist(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const l2 = dx * dx + dy * dy || 1;
      const t = W.clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1);
      return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    }

    function slice(a, b) {
      if (state !== 'play' || Math.hypot(b.x - a.x, b.y - a.y) < 3) return;
      let combo = 0;
      for (const it of items) {
        if (it.cut || segDist(it, a, b) > FS() * 0.5) continue;
        it.cut = true;
        if (it.bomb) { flash = 0.4; return die(); }
        combo++;
        const ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
        for (const s of [-1, 1]) halves.push({ x: it.x, y: it.y, vx: it.vx + Math.cos(ang) * s * 60, vy: it.vy * 0.3 + Math.sin(ang) * s * 60, rot: it.rot, vr: s * 5, e: it.e, side: s });
        splats.push({ x: it.x, y: it.y, t: 1 });
      }
      if (combo) { score += combo + (combo >= 3 ? combo : 0); updateHud(); }
    }

    function update(dt) {
      elapsed += dt;
      spawnT -= dt;
      if (spawnT <= 0) { toss(); spawnT = W.rand(0.7, 1.3) * Math.max(0.5, 1 - elapsed / 90); }
      const g = view.h * 1.6;
      for (const it of [...items, ...halves]) {
        it.vy += g * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
      }
      for (const it of items) {
        if (!it.cut && it.vy > 0 && it.y > view.h + 30) {
          it.gone = true;
          if (!it.bomb) { misses++; updateHud(); if (misses >= 3) return die(); }
        }
      }
      items = items.filter(it => !it.cut && !it.gone);
      halves = halves.filter(h => h.y < view.h + 40);
    }

    function die() {
      state = 'over';
      const best = W.best('fruit', score);
      setTimeout(() => W.overlay({ title: misses >= 3 ? 'Too many drops' : '💥 Bomb!', big: score, text: `Best ${best}`, button: 'Again', onStart: start }), 600);
    }

    function render(dt) {
      const { w, h } = view;
      ctx.fillStyle = '#2a1a10';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#3a2616';
      for (let i = 0; i < 6; i++) ctx.fillRect(0, i * h / 6, w, 1);

      for (const s of splats) {
        s.t -= dt * 0.5;
        ctx.fillStyle = `rgba(255,69,58,${Math.max(0, s.t) * 0.35})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, FS() * 0.6, 0, Math.PI * 2); ctx.fill();
      }
      splats = splats.filter(s => s.t > 0);

      const fs = FS();
      ctx.font = `${Math.round(fs)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const it of items) { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.fillText(it.e, 0, 0); ctx.restore(); }
      for (const hf of halves) {
        ctx.save();
        ctx.translate(hf.x, hf.y);
        ctx.rotate(hf.rot);
        ctx.beginPath();
        ctx.rect(hf.side < 0 ? -fs : 0, -fs, fs, fs * 2);  // show only one half
        ctx.clip();
        ctx.fillText(hf.e, 0, 0);
        ctx.restore();
      }

      // Blade trail.
      const now = performance.now();
      trail = trail.filter(p => now - p.t < 150);
      if (trail.length > 1) {
        ctx.strokeStyle = '#fff';
        ctx.lineCap = 'round';
        for (let i = 1; i < trail.length; i++) {
          ctx.lineWidth = 1 + (i / trail.length) * 3;
          ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
        }
      }
      if (flash > 0) { flash -= dt; ctx.fillStyle = `rgba(255,255,255,${flash * 2})`; ctx.fillRect(0, 0, w, h); }
    }

    let last = null;
    W.pointer(canvas, {
      down(p) { last = p; trail = [{ ...p, t: performance.now() }]; },
      move(p) { if (last) { slice(last, p); last = p; trail.push({ ...p, t: performance.now() }); } },
      up() { last = null; },
    });

    function start() { reset(); state = 'play'; }

    reset();
    W.overlay({ title: '🍉 Fruit Slice', text: 'Swipe to slice fruit.<br>Don\'t drop 3. Avoid 💣!', onStart: start });
    W.loop(dt => { if (state === 'play') update(dt); render(dt); });
  </script>
</body>
</html>
