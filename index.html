<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <meta name="theme-color" content="#000000">
  <title>Watch Games</title>
  <link rel="stylesheet" href="css/watch.css?v=1790818265">
</head>
<body>
  <main class="hub">
    <h1>Watch Games</h1>
    <p class="sub" id="count"></p>
    <div class="chips" id="chips"></div>
    <nav class="list" id="list"></nav>
  </main>
  <script src="js/common.js?v=1790818265"></script>
  <script src="js/games.js?v=1790818265"></script>
  <script src="js/packs.js?v=1790818265"></script>
  <script>
    const list = document.getElementById('list');
    const chips = document.getElementById('chips');
    const FILTERS = ['All', '📦 Packs', '⌚ Crown', ...Object.keys(CATEGORIES)];
    const packList = Object.values(PACKS);
    const levelCount = packList.reduce((a, p) => a + p.count, 0);
    // Always open on 'All' so a filter tapped earlier never hides games.
    let filter = 'All';

    function matches(g) {
      if (filter === 'All') return true;
      if (filter === '⌚ Crown') return CROWN.includes(g.id);
      return (CATEGORIES[filter] || []).includes(g.id);
    }

    function render() {
      chips.innerHTML = '';
      for (const f of FILTERS) {
        const b = document.createElement('button');
        b.className = 'chip' + (f === filter ? ' on' : '');
        b.textContent = f;
        b.addEventListener('click', () => {
          filter = f;
          render();
        });
        chips.appendChild(b);
      }
      const shown = filter === '📦 Packs' ? [] : GAMES.filter(matches);
      const total = (GAMES.length + levelCount).toLocaleString();
      document.getElementById('count').textContent = filter === 'All' ? `${total} games & levels`
        : filter === '📦 Packs' ? `${levelCount.toLocaleString()} levels in ${packList.length} packs` : `${shown.length} games`;
      list.innerHTML = '';
      for (const g of shown) {
        const best = W.best(g.id);
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = 'games/' + g.id + '.html';
        a.innerHTML =
          `<span class="ico" style="background:${g.color}33">${g.emoji}</span>` +
          `<span><div class="name">${g.name}${CROWN.includes(g.id) ? ' <span class="crown" title="Digital Crown">⌚</span>' : ''}</div><div class="desc">${g.desc}</div>` +
          (best !== null ? `<div class="best">Best ${best}${g.unit || ''}</div>` : '') +
          `</span>`;
        list.appendChild(a);
      }
      if (filter === 'All' || filter === '📦 Packs') for (const p of packList) {
        let solved = 0;
        for (let n = 1; n <= p.count; n++) if (W.isSolved(`${p.id}.${n}`)) solved++;
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = 'pack.html?id=' + p.id;
        a.innerHTML = `<span class="ico" style="background:${p.color}33">${p.emoji}</span>` +
          `<span><div class="name">${p.name}</div><div class="desc">${p.count} levels</div>` +
          (solved ? `<div class="best">${solved} solved</div>` : '') + `</span>`;
        list.appendChild(a);
      }
    }
    render();
  </script>
</body>
</html>
