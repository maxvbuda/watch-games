<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="disable-adaptations" content="watch">
  <meta name="theme-color" content="#000000">
  <title>Watch Games</title>
  <link rel="stylesheet" href="css/watch.css">
</head>
<body>
  <main class="hub">
    <h1>Watch Games</h1>
    <p class="sub" id="count"></p>
    <div class="chips" id="chips"></div>
    <nav class="list" id="list"></nav>
  </main>
  <script src="js/common.js"></script>
  <script src="js/games.js"></script>
  <script>
    const list = document.getElementById('list');
    const chips = document.getElementById('chips');
    const FILTERS = ['All', '⌚ Crown', ...Object.keys(CATEGORIES)];
    let filter = 'All';
    try { filter = localStorage.getItem('wg.filter') || 'All'; } catch (e) {}
    if (!FILTERS.includes(filter)) filter = 'All';

    function matches(g) {
      if (filter === 'All') return true;
      if (filter === '⌚ Crown') return CROWN.includes(g.id);
      return (CATEGORIES[filter] || []).includes(g.id);
    }

    function render() {
      chips.innerHTML = '';
      for (const f of FILTERS) {
        const b = document.createElement('button');
        b.className = 'chip' + (f === filter ? ' on' : '');
        b.textContent = f;
        b.addEventListener('click', () => {
          filter = f;
          try { localStorage.setItem('wg.filter', f); } catch (e) {}
          render();
        });
        chips.appendChild(b);
      }
      const shown = GAMES.filter(matches);
      document.getElementById('count').textContent = `${shown.length} of ${GAMES.length} games`;
      list.innerHTML = '';
      for (const g of shown) {
        const best = W.best(g.id);
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = 'games/' + g.id + '.html';
        a.innerHTML =
          `<span class="ico" style="background:${g.color}33">${g.emoji}</span>` +
          `<span><div class="name">${g.name}${CROWN.includes(g.id) ? ' <span class="crown" title="Digital Crown">⌚</span>' : ''}</div><div class="desc">${g.desc}</div>` +
          (best !== null ? `<div class="best">Best ${best}${g.unit || ''}</div>` : '') +
          `</span>`;
        list.appendChild(a);
      }
    }
    render();
  </script>
</body>
</html>
